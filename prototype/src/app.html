<title>RydeResolve</title>
<meta name="description" content="Interactive prototype of RydeResolve: rider and driver apps, the support console, and the AI hearing, on real pipeline data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an Apple-calm product world. Grey ground, white sheets, one ink.
   Colour only does jobs: violet = rider, teal = driver, green/amber/red = outcome state,
   blue = links and focus. Deliberately a single light theme, for a consistent recording. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --fill: #ececf0;
  --fill-2: #e3e3e8;
  --line: #d2d2d7;
  --hair: #e8e8ed;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-3: #6e6e73;
  --ink-4: #8a8a8f;
  --link: #0066cc;
  --focus: #0071e3;
  --rider: #6e4fd8;
  --rider-soft: #f2eefd;
  --driver: #087a8c;
  --driver-soft: #e5f3f5;
  --good: #1d7f3a;
  --good-soft: #e8f5eb;
  --warn: #a85400;
  --warn-soft: #fcf0e1;
  --bad: #c8102e;
  --bad-soft: #fcebed;
  --map: #eef0f3;
  --map-grid: #e2e5ea;
  --shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 8px 24px rgb(0 0 0 / 6%);
  --shadow-lift: 0 2px 6px rgb(0 0 0 / 6%), 0 24px 48px rgb(0 0 0 / 12%);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.47;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}
::selection { background: color-mix(in srgb, var(--focus) 22%, transparent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); text-underline-offset: 3px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--font-display); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.topbar-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; background: none; border: 0; padding: 0; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 0 1 auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
@media (max-width: 1000px) { .topbar .note { display: none; } .topbar-in { gap: 12px; padding: 0 16px; } }
.nav button { border: 0; background: none; padding: 7px 12px; border-radius: 980px; font-size: 14px; color: var(--ink-3); white-space: nowrap; transition: background .15s, color .15s; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--fill); font-weight: 500; }
.topbar .spacer { flex: 1; }
.topbar .note { font-size: 12px; color: var(--ink-4); white-space: nowrap; }

/* ---------- shared atoms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 980px; padding: 11px 20px; font-size: 15px; font-weight: 500; transition: background .15s, transform .15s; text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #333336; }
.btn-secondary { background: var(--fill); color: var(--ink); }
.btn-secondary:hover { background: var(--fill-2); }
.btn-quiet { background: none; color: var(--link); padding-inline: 4px; }
.btn-quiet:hover { text-decoration: underline; }
.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
kbd { font-family: var(--font); font-size: 11px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-left: 2px; }
.btn-primary kbd { background: transparent; color: #c7c7cc; border-color: #4a4a4f; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 980px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.neutral { color: var(--ink-2); background: var(--fill); }
.pill.live { color: var(--ink-2); background: var(--fill); }
.pill.live::before { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

.party { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.party i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.party.rider { --c: var(--rider); }
.party.driver { --c: var(--driver); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.avatar.rider { background: var(--rider-soft); color: var(--rider); }
.avatar.driver { background: var(--driver-soft); color: var(--driver); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink-3); background: var(--fill); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag.rule { background: none; border: 1px dashed var(--line); }

/* citation chip: the signature move */
.cite { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px 1px 6px; margin: 1px 2px; vertical-align: 1px; transition: border-color .15s, background .15s, box-shadow .15s; }
.cite:hover, .cite:focus-visible { border-color: var(--ink-3); background: var(--surface-2); box-shadow: 0 1px 4px rgb(0 0 0 / 8%); }
.cite svg { color: var(--ink-4); }
.cite.policy { border-style: dashed; }
.popover { position: fixed; z-index: 60; width: 300px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lift); border: 1px solid var(--hair); padding: 12px; pointer-events: none; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.popover-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--ink-3); }

/* ---------- page frames ---------- */
.page { max-width: 1320px; margin: 0 auto; padding: 32px 24px 96px; }
.stage { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.narration { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 22px; }
.persona { display: flex; align-items: center; gap: 12px; }
.persona h1 { font-size: 22px; letter-spacing: -0.02em; }
.scenarios { display: flex; flex-direction: column; gap: 4px; }
.scenarios h2 { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-bottom: 4px; font-family: var(--font); }
.scenario { text-align: left; background: none; border: 0; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; transition: background .15s; }
.scenario:hover { background: var(--fill); }
.scenario[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.scenario .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 2px; display: grid; place-items: center; }
.scenario[aria-pressed="true"] .radio { border-color: var(--ink); }
.scenario[aria-pressed="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.scenario strong { display: block; font-size: 14px; font-weight: 600; }
.scenario span { font-size: 13px; color: var(--ink-3); }
.caption { background: var(--surface); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.caption h3 { font-size: 15px; font-family: var(--font); font-weight: 600; }
.caption p { font-size: 14px; color: var(--ink-2); }
.steps-dots { display: flex; gap: 6px; }
.steps-dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--fill-2); transition: background .25s; }
.steps-dots i.on { background: var(--ink); }

/* ---------- phone ---------- */
.phone-wrap { display: flex; justify-content: center; }
.phone { width: min(390px, 100%); height: 820px; border-radius: 58px; background: #0b0b0c; padding: 13px; box-shadow: 0 0 0 1px #2a2a2c, 0 30px 70px rgb(0 0 0 / 22%), 0 8px 20px rgb(0 0 0 / 12%); position: relative; flex: none; }
.phone-screen { height: 100%; border-radius: 46px; overflow: hidden; background: var(--surface-2); position: relative; display: flex; flex-direction: column; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; background: #000; border-radius: 20px; z-index: 5; }
.statusbar { height: 54px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 36px; font-size: 15px; font-weight: 600; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.app-view { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.app-head { padding: 6px 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.app-head h2 { font-size: 30px; letter-spacing: -0.025em; font-weight: 700; }
.app-head .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--link); font-size: 16px; padding: 4px 0; margin-left: -6px; }
.app-body { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet { background: var(--surface); border-radius: 18px; overflow: hidden; }
.sheet-pad { padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.row + .row { border-top: 1px solid var(--hair); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 16px; font-weight: 500; }
.row .sub { font-size: 13px; color: var(--ink-3); }
button.row { width: 100%; border: 0; background: none; text-align: left; }
button.row:hover { background: var(--surface-2); }
.choice { width: 100%; border: 0; background: var(--surface); text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 16px; }
.choice + .choice { border-top: 1px solid var(--hair); }
.choice[aria-checked="true"] { background: color-mix(in srgb, var(--fill) 60%, var(--surface)); }
.choice .check { margin-left: auto; color: var(--ink); }
.field-label { font-size: 13px; color: var(--ink-3); padding: 0 4px 6px; }
textarea.input { width: 100%; min-height: 128px; resize: none; border: 0; border-radius: 18px; padding: 14px 16px; font: inherit; font-size: 16px; line-height: 1.45; background: var(--surface); color: var(--ink); }
textarea.input:focus { outline: 2px solid color-mix(in srgb, var(--focus) 45%, transparent); }
.app-footer { padding: 12px 16px 26px; background: linear-gradient(to top, var(--surface-2) 70%, transparent); position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; }
.attached { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.attached + .attached { border-top: 1px solid var(--hair); }
.attached .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--fill); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.attached .ok { margin-left: auto; color: var(--good); }

.hero-result { padding: 8px 4px 4px; display: flex; flex-direction: column; gap: 10px; }
.hero-result .badge-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.hero-result h3 { font-size: 30px; letter-spacing: -0.03em; line-height: 1.08; font-weight: 700; }
.hero-result p { color: var(--ink-2); font-size: 16px; }
.facts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.facts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 16px; font-size: 15px; }
.facts li + li { border-top: 1px solid var(--hair); }
.facts li svg { margin-top: 2px; color: var(--ink-3); }
.sheet h4 { font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 14px 16px 0; font-family: var(--font); }
.quote-box { padding: 10px 16px 14px; font-size: 15px; color: var(--ink-2); }
.rule-box { padding: 12px 16px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.tracker { list-style: none; margin: 0; padding: 6px 0; }
.tracker li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 10px 16px; position: relative; }
.tracker li::before { content: ""; position: absolute; left: 29px; top: 34px; bottom: -10px; width: 2px; background: var(--fill-2); }
.tracker li:last-child::before { display: none; }
.tracker li.done::before { background: var(--ink); }
.tracker .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-4); transition: background .25s, color .25s; position: relative; z-index: 1; }
.tracker li.done .dot { background: var(--ink); color: #fff; }
.tracker li.now .dot { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
.tracker li.now .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--ink); opacity: .2; animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(.85); opacity: .35; } to { transform: scale(1.25); opacity: 0; } }
.tracker .lbl { font-size: 15px; font-weight: 500; padding-top: 3px; }
.tracker .lbl small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-3); }
.tracker li:not(.done):not(.now) .lbl { color: var(--ink-4); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--surface); }
.notice .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }

/* ---------- maps ---------- */
.map { display: block; width: 100%; height: auto; background: var(--map); }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); padding: 8px 14px 10px; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- desktop apps ---------- */
.console { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .console { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
.panel-head h2 { font-size: 17px; font-family: var(--font); font-weight: 600; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-title h1 { font-size: 34px; letter-spacing: -0.03em; font-weight: 700; }
.page-title p { color: var(--ink-3); font-size: 16px; max-width: 60ch; margin-top: 4px; }
.queue-item { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 20px; border-top: 1px solid var(--hair); position: relative; }
.queue-item:hover { background: var(--surface-2); }
.queue-item[aria-current="true"] { background: var(--fill); }
.queue-item.safety::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--bad); }
.queue-item .t { font-weight: 600; font-size: 15px; }
.queue-item .m { font-size: 13px; color: var(--ink-3); }
.queue-item .r { text-align: right; font-size: 13px; color: var(--ink-3); }
.section { padding: 20px 24px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 14px; }
.section h3 { font-size: 15px; font-family: var(--font); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.bubbles { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
.bubble.rider { background: var(--rider-soft); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.driver { background: var(--driver-soft); align-self: flex-end; border-bottom-right-radius: 6px; }
.bubble.hl { box-shadow: 0 0 0 2px var(--ink); }
.bubble .who { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; display: flex; gap: 8px; }
.photo { position: relative; border-radius: 14px; overflow: hidden; background: var(--fill); }
.photo img { display: block; width: 100%; height: auto; transition: filter .25s; }
.photo.blur img { filter: blur(22px) saturate(.6); transform: scale(1.08); }
.photo .reveal { position: absolute; inset: 0; display: grid; place-items: center; background: none; border: 0; color: #fff; font-weight: 600; text-shadow: 0 1px 6px rgb(0 0 0 / 50%); }
.debate { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .debate { grid-template-columns: minmax(0, 1fr); } }
.side { border-radius: 16px; padding: 16px; background: var(--surface-2); border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side.rider { border-top: 3px solid var(--rider); }
.side.driver { border-top: 3px solid var(--driver); }
.side p { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.more-btn { border: 0; background: none; padding: 0; color: var(--link); font-size: 13px; align-self: flex-start; }
.verdict { border-radius: 16px; background: var(--surface); border: 1px solid var(--hair); overflow: hidden; }
.verdict-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; flex-wrap: wrap; }
.verdict-head h4 { font-size: 22px; letter-spacing: -0.02em; font-weight: 700; }
.findings { margin: 0; padding: 0 20px 18px; list-style: none; counter-reset: f; display: flex; flex-direction: column; gap: 12px; }
.findings li { counter-increment: f; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.findings li::before { content: counter(f); width: 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--ink-3); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.conf { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.conf-track { height: 6px; border-radius: 6px; background: var(--fill); position: relative; }
.conf-fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--ink); }
.conf-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); border-radius: 2px; }
.conf-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .checks { grid-template-columns: minmax(0, 1fr); } }
.check-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--hair); font-size: 14px; }
.check-row .ci { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.check-row.pass .ci { background: var(--good-soft); color: var(--good); }

}
function policyText(ref) {
  const pid = ref.slice(0, 6);

  return hit ? hit.excerpt.split(" — ").slice(1).join(" — ") || hit.excerpt : "";
}
function Preview({ caseId, refId, compact }) {

/* ---------------- map: drawn from the case file's own coordinates ---------------- */
function TripMap({ caseId, height = 220, legend = true }) {
  const ev = evOf(caseId);
  const opt = ev["ROUTE-OPTIMAL"] ? ev["ROUTE-OPTIMAL"].data.geometry.coordinates : [];
  const act = ev["ROUTE-ACTUAL"] ? ev["ROUTE-ACTUAL"].data.geometry.coordinates : [];
  const gps = ev["GPS-TRACE"] ? ev["GPS-TRACE"].data : [];
  const prox = ev["PICKUP-PROXIMITY"] ? ev["PICKUP-PROXIMITY"].data : null;
  const traffic = Object.entries(ev).filter(([, e]) => e.kind === "traffic_event").map(([k, e]) => ({ k, lat: e.data.near_lat, lng: e.data.near_lng }));
  const noShow = prox && !prox.reached_pickup;
  const W = 420, H = Math.round(W * height / 420 * 0.62 + 120), pad = 28;
  const pts = [...opt, ...act, ...gps.map((p) => [p.lng, p.lat]), ...(prox ? [[prox.pickup.lng, prox.pickup.lat]] : []), ...traffic.map((t) => [t.lng, t.lat])];
  if (!pts.length) return html`<p class="small muted" style=${{ padding: 16 }}>No location data.</p>`;
  const lat0 = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  const kx = Math.cos(lat0 * Math.PI / 180);
  let xs = pts.map((p) => p[0] * kx), ys = pts.map((p) => p[1]);
  let [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const span = 0.006;
  if (x1 - x0 < span) { x0 -= span / 2; x1 += span / 2; }
  if (y1 - y0 < span) { y0 -= span / 2; y1 += span / 2; }
  const s = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const px = (lng, lat) => [ox + (lng * kx - x0) * s, oy + (y1 - lat) * s];
  const path = (c) => c.map(([lng, lat], i) => `${i ? "L" : "M"}${px(lng, lat).map((n) => n.toFixed(1)).join(" ")}`).join(" ");
  const mPerPx = 111320 / s;
  const bar = [100, 200, 500, 1000, 2000, 5000].find((m) => m / mPerPx > 56) || 5000;
  const start = (act[0] || opt[0]), end = (act[act.length - 1] || opt[opt.length - 1]);
  const pickup = prox ? px(prox.pickup.lng, prox.pickup.lat) : null;

const POLICY_INFO = {
  "POL-01": ["General principles", "Every decision rests on evidence, not on who argues harder. Both sides are held to the same standard, and whoever makes a claim has to support it."],
  "POL-02": ["Route deviation", "If a trip was much longer than the fastest route and nothing on record explains it, the fare for the extra distance is refunded: nothing under 10% longer, half between 10% and 25%, all of it above 25%. Roadworks or a closure near the route, or a detour the rider asked for, explain a detour."],
  "POL-03": ["No-show charge", "The $4.50 no-show fee stands only if the driver reached the pickup point (within 100 m), waited the grace period and tried to reach the rider. Otherwise it is waived."],
  "POL-04": ["Cleaning and damage fees", "A driver needs at least one photo. The fee follows what the photo shows: $40 for a spill or crumbs, $120 for mud, dirt or stains, $200 for vomit. Without a photo, the claim is declined and can be sent again."],
  "POL-05": ["Safety incidents", "Safety reports aren't decided under this policy. They go straight to a person."],
  "POL-06": ["Evidence standard", "When the evidence a claim needs is missing, the claim is declined, not denied, and can be refiled with that evidence."],
  "POL-07": ["Remedies and caps", "Refunds can't exceed the fare, cleaning fees can't exceed $200, and a waiver returns exactly the fee charged."],
  "POL-08": ["When a person decides", "A person decides when confidence is low, the fee is $120 or more, either party has filed three or more disputes in 30 days, or a rule check fails."],
};
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/`(.+?)`/g, "<code>$1</code>");
function mdToHtml(src) {
  const blocks = src.trim().split(/\n\s*\n/);
  return blocks.map((b) => {
    const lines = b.split("\n").filter((l) => l.trim());
    if (lines.every((l) => l.trim().startsWith("|"))) {
      const rows = lines.filter((l) => !/^\|\s*-/.test(l.trim())).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      const [head, ...body] = rows;
      return `<div class="md-table"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if (lines.every((l) => /^\s*[-*] /.test(l) || /^\s{2,}/.test(l))) {
      return `<ul>${lines.filter((l) => /^\s*[-*] /.test(l)).map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
    }
    return `<p>${inline(lines.join(" "))}</p>`;
  }).join("");
}
const clauseBody = (excerpt) => excerpt.replace(/^§\d+\.[^—]*—\s*/, "");
function sourceOf(text) {
  if (/not Ryde-sourced|our own/i.test(text)) return ["neutral", "Includes our own rules"];
  if (/real, sourced|help\.rydesharing|Terms of Use/i.test(text)) return ["good", "Ryde's published figures"];
  return null;
}
function PolicyView({ refId }) {
  const pid = refId.slice(0, 6);
  const clauses = D.policy[pid] || [];
  const cited = clauses.find((c) => c.chunk_id === refId);
  const [title, summary] = POLICY_INFO[pid] || [pid, ""];
  const others = clauses.filter((c) => c !== cited);
  return html`<div style=${{ display: "flex", flexDirection: "column", gap: 16 }}>
    <div><h3 style=${{ fontSize: 22, letterSpacing: "-0.02em" }}>${title}</h3><p style=${{ marginTop: 8, fontSize: 16, color: "var(--ink-2)" }}>${summary}</p></div>
    ${cited && html`<div class="clause cited"><div class="clause-head"><span class="mono">${cited.chunk_id}</span><span>The clause cited</span>${sourceOf(cited.excerpt) && html`<span class=${`pill ${sourceOf(cited.excerpt)[0]}`}>${sourceOf(cited.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(cited.excerpt)) }}></div></div>`}
    ${!cited && html`<div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>${clauses.map((c) => html`<div key=${c.chunk_id} class="clause"><div class="clause-head"><span class="mono">${c.chunk_id}</span>${sourceOf(c.excerpt) && html`<span class=${`pill ${sourceOf(c.excerpt)[0]}`}>${sourceOf(c.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(c.excerpt)) }}></div></div>`)}</div>`}
    ${cited && others.length > 0 && html`<details class="more"><summary><${Icon} name="right" size=${14} />The rest of this section (${others.length} clause${others.length === 1 ? "" : "s"})</summary>
      <div style=${{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>${others.map((c) => html`<div key=${c.chunk_id} class="clause"><div class="clause-head"><span class="mono">${c.chunk_id}</span>${sourceOf(c.excerpt) && html`<span class=${`pill ${sourceOf(c.excerpt)[0]}`}>${sourceOf(c.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(c.excerpt)) }}></div></div>`)}</div></details>`}

  if (/vomit|spill|mess|dirt|mud|stain|clean|seat/.test(t)) return "damage";

const STAGES = {
  rider: (other) => [["Report received", ""], ["Checking eligibility", "Quick checks, no AI"], ["Gathering trip records", "GPS, route, fare, messages"], [`${first(other)} replies`, "They get to tell their side"], ["Hearing both sides", "An advocate argues for each of you"], ["Decision", ""]],

  driverFile: (other) => [["Report received", ""], ["Checking eligibility", "Quick checks, no AI"], ["Gathering trip records", "Trip, messages and your photo"], ["Photo check", "What the photo shows sets the fee tier"], [`${first(other)} replies`, "They get to tell their side"], ["Hearing both sides", "An advocate argues for each of you"], ["With a specialist", "Fees of $120 or more get a person's review"]],
};
function Tracking({ caseId, who, onDone, onProgress }) {
  const v = CASES[caseId].view;
  const safety = v.state === "safety_bypassed";
  const stages = safety ? [["Report received", ""], ["Sent to our safety team", "A person handles this"]] : STAGES[who](who === "driver" ? v.complainer_name : v.complainee_name);
  const [at, setAt] = useState(0);
  useEffect(() => {
    if (at >= stages.length) { const t = setTimeout(onDone, 700); return () => clearTimeout(t); }
    const t = setTimeout(() => setAt(at + 1), at === 0 ? 500 : 1100);
    return () => clearTimeout(t);
  }, [at]);
  useEffect(() => { if (onProgress) onProgress(at, stages.length); }, [at]);
  return html`<div class="app-view">
    <div class="app-head"><h2>${at >= stages.length ? "Done" : "In progress"}</h2><p class="muted small">${CAT[v.category]} · ${caseId}</p></div>
    <div class="app-body">
      <div class="sheet"><ol class="tracker" aria-live="polite">${stages.map(([l, s], i) => html`<li key=${l} class=${i < at ? "done" : i === at ? "now" : ""}><span class="dot">${i < at ? html`<${Icon} name="check" size=${15} stroke=${2.6} />` : ""}</span><span class="lbl">${l}${s && html`<small>${s}</small>`}</span></li>`)}</ol></div>
    </div>
  </div>`;
}

  if (q.escalation && q.escalation.confidence_escalate) out.push(["warn", "Low confidence"]);
  if (q.escalation && q.escalation.compliance_veto) out.push(["bad", "Rule check failed"]);

}

function buildSteps(id) {
  const t = traceOf(id);

  const stoppedAtRules = prevention && !(prevention.detail || "").startsWith("prevention: pass");
  if (!stoppedAtRules) {
    steps.push({ key: "evidence", label: "Exhibits", kind: "ai" });
    if (tool) steps.push({ key: "photo", label: "Photo examined", kind: "ai" });
    if (has("rider_advocate")) steps.push({ key: "hearing", label: "Counsel", kind: "ai" }, { key: "judge", label: "The bench", kind: "ai" }, { key: "gates", label: "Final checks", kind: "rule" });

        <p>Filed as ${CAT_FULL[triage.category].toLowerCase()}, ${triage.tier} severity. ${triage.is_safety ? html`<strong style=${{ color: "var(--bad)" }}>Safety flag: the case leaves the court and goes to a person.</strong>` : "No safety concern."}</p><${More} agent="triage" /></div></div>`}
      ${visible("rules") && prevention && html`<div class="step rule"><span class="step-ic"><${Icon} name="check" size=${18} /></span><div class="step-body"><div class="step-title"><h3>Clerk's checks</h3><span class="tag rule">Plain code, no AI</span></div>
        <p>${stoppedAtRules ? (prevention.detail.includes("safety") ? "Safety hard stop: no agent hears this case. It goes straight to the safety team." : "Required evidence missing: declined, not denied. The claimant can refile with a photo.") : "All six checks passed: not a duplicate, well formed, not safety, evidence present, within 30 days, filer history noted."}</p></div></div>`}
      ${visible("evidence") && evOut && html`<div class="step"><span class="step-ic"><${Icon} name="file" size=${18} /></span><div class="step-body"><div class="step-title"><h3>Exhibits entered</h3><span class="tag">AI</span><span class="t">${secs(ue("evidence_collection") && ue("evidence_collection").ms)}</span></div>
        <p>The only agent allowed to read raw records. It entered ${evRefs.length} exhibits: ${evOut.counts.gps} GPS fixes, ${evOut.counts.chat} messages, ${evOut.counts.photos} photo${evOut.counts.photos === 1 ? "" : "s"}, the fare and both histories. Counsel on both sides gets the identical set.</p>
        <ol class="exhibits">${evRefs.map((r) => html`<li key=${r}><span class="ex-no">Exhibit ${exhibitNo[r]}</span><${Cite} caseId=${id} refId=${r} /></li>`)}</ol><${More} agent="evidence_collection" /></div></div>`}
      ${visible("photo") && tool && html`<div class="step"><span class="step-ic"><${Icon} name="camera" size=${18} /></span><div class="step-body"><div class="step-title"><h3>Photo examined</h3><span class="tag">AI vision</span><span class="t">${secs(tool.latency_ms)}</span></div>
        ${Object.entries(tool.output.findings).map(([ref, f]) => html`<div key=${ref} style=${{ display: "grid", gridTemplateColumns: "minmax(0, 200px) minmax(0, 1fr)", gap: 16, alignItems: "start" }}>
          <div class="photo"><img src=${evOf(id)[ref].data.image} alt="Damage photo" /></div>
          <div style=${{ display: "flex", flexDirection: "column", gap: 8 }}><p>${f.description}</p><dl class="kv"><dt>What it shows</dt><dd>${f.mess_type.replace("_", " ")}, ${f.extent} area</dd><dt>Fee tier</dt><dd>${f.tier} · ${money({ minor: 40, moderate: 120, severe: 200 }[f.tier])}</dd><dt>Confidence</dt><dd>${f.confidence.toFixed(2)}</dd></dl><p class="tiny muted">The model only says what it sees. The tier comes from Ryde's fee table, in code.</p></div>
        </div>`)}</div></div>`}
      ${visible("hearing") && riderArg && html`<div class="step"><span class="step-ic"><${Icon} name="scale" size=${18} /></span><div class="step-body"><div class="step-title"><h3>The hearing</h3><span class="tag">Two AI counsel, in parallel</span><span class="t">${secs(agentEvent(id, "rider_advocate").latency_ms)}</span></div>
        <div class="courtroom">
          ${visible("judge") && dec && html`<div class="bench-bar"><span><${Icon} name="gavel" size=${15} />The bench</span><span class="tiny muted">Reads both arguments and the exhibits. Never the complaint.</span></div>`}
          <div class="debate">
            <${Counsel} role="rider" arg=${riderArg} agent="rider_advocate" party=${v.complainer_role === "rider" ? v.complainer_name : v.complainee_name} />
            <${Counsel} role="driver" arg=${driverArg} agent="driver_advocate" party=${v.complainer_role === "driver" ? v.complainer_name : v.complainee_name} />
          </div>
        </div>
        <p class="hearing-note"><${Icon} name="info" size=${15} />Any citation that isn't an exhibit on file is struck before the bench sees the argument.</p></div></div>`}
      ${visible("judge") && dec && html`<div class="step"><span class="step-ic"><${Icon} name="gavel" size=${18} /></span><div class="step-body"><div class="step-title"><h3>The bench rules</h3><span class="tag">AI</span><span class="t">${secs(agentEvent(id, "judge").latency_ms)}</span></div>
        <${Verdict} caseId=${id} dec=${dec} court=${true} /><p class="tiny muted">Dollar amounts the policy fixes are computed in code, not by the Judge.</p><${More} agent="judge" /></div></div>`}
      ${visible("gates") && gateChecks && html`<div class="step rule"><span class="step-ic"><${Icon} name="check" size=${18} /></span><div class="step-body"><div class="step-title"><h3>Final checks</h3><span class="tag rule">Plain code, no AI</span></div>
        <div class="checks">${gateChecks.map(([ok, t, s]) => html`<div key=${t} class=${`check-row ${ok ? "pass" : "flag"}`}><span class="ci"><${Icon} name=${ok ? "check" : "alert"} size=${13} stroke=${2.6} /></span><div><strong>${t}</strong><small>${s}</small></div></div>`)}</div></div></div>`}
      ${visible("outcome") && html`<div class="step"><span class="step-ic" style=${{ background: v.state === "decided" ? "var(--good-soft)" : v.state === "declined_insufficient_evidence" ? "var(--fill)" : v.state === "safety_bypassed" ? "var(--bad-soft)" : "var(--warn-soft)", border: 0 }}><${Icon} name=${v.state === "decided" ? "check" : "user"} size=${18} /></span><div class="step-body"><div class="step-title"><h3>${{ decided: "Judgment entered", escalated: "Referred to a person", safety_bypassed: "With the safety team", declined_insufficient_evidence: "Declined, can refile" }[v.state]}</h3></div>
        <p class="muted">${{ decided: "Every final check passed, so the ruling stands without review.", escalated: "A final check flagged it, so the ruling waits in the support console for a person.", safety_bypassed: "No agent heard this case. It sits at the top of the support console.", declined_insufficient_evidence: "The claimant was told exactly what was missing." }[v.state]}</p></div></div>`}
    </div>
  </section>`;
}
function Accuracy({ open }) {
  const g = D.golden;
  const cats = Object.entries(g.by_category);
  return html`<div style=${{ display: "flex", flexDirection: "column", gap: 20 }}>
    <section class="panel" style=${{ padding: "28px 28px 24px", display: "grid", gridTemplateColumns: "minmax(0, 1fr) minmax(0, 1.2fr)", gap: 40 }}>
      <div><div class="acc-big">${g.passed}/${g.total}</div><p style=${{ fontSize: 18, marginTop: 14, color: "var(--ink-2)", maxWidth: "36ch" }}>Labelled cases where the verdict matched the label: outcome, remedy and exact amount. Each was filed through the full pipeline with real model calls.</p></div>
      <div style=${{ display: "flex", flexDirection: "column", gap: 18 }}>
        <div class="cat-bars">${cats.map(([k, b]) => html`<div key=${k} class="cat-bar"><span>${CAT_FULL[k]}</span><span class="bar"><i style=${{ width: `${(b.passed / b.run) * 100}%` }}></i></span><span class="num" style=${{ textAlign: "right" }}>${b.passed}/${b.run}</span></div>`)}</div>
        <dl class="kv" style=${{ marginTop: 6 }}><dt>Decided with no person</dt><dd>${g.decided_automatically} of ${g.total}</dd><dt>Sent to a person</dt><dd>${g.sent_to_a_person} (safety, high-value, repeat filers)</dd><dt>Median time per case</dt><dd>${Math.round(g.median_seconds)} s</dd></dl>
      </div>
    </section>
    <section class="panel"><div class="panel-head"><h2>Every labelled case</h2><span class="tiny muted">Labels written from the synthetic data's ground truth</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Case</th><th>Category</th><th>Label</th><th>System said</th><th>Result</th><th class="r">Time</th></tr></thead><tbody>
        ${g.cases.map((c) => { const r = c.result; const a = r.actual; const said = a.state === "safety_bypassed" ? "To the safety team" : a.outcome ? `${OUTCOME[a.outcome] || a.outcome}${a.remedy && a.remedy.amount ? ` · ${money(a.remedy.amount)}` : ""}` : a.state === "declined_insufficient_evidence" ? "Declined, can refile" : a.state; const label = c.expected.outcome === "escalated_to_l2" ? "To the safety team" : `${OUTCOME[c.expected.outcome] || c.expected.outcome}${c.expected.remedy && c.expected.remedy.amount ? ` · ${money(c.expected.remedy.amount)}` : ""}`; return html`<tr key=${c.golden_id}><td>${CASES[r.case_id] ? html`<button class="btn-quiet mono" style=${{ border: 0, background: "none", padding: 0, color: "var(--link)" }} onClick=${() => open(r.case_id)}>${r.case_id}</button>` : html`<span class="mono">${r.case_id}</span>`}</td><td>${CAT_FULL[c.category]}</td><td>${label}</td><td>${said}</td><td><span class=${`pill ${r.passed ? "good" : "bad"}`}>${r.passed ? "Match" : "Mismatch"}</span></td><td class="r">${Math.round(r.seconds)} s</td></tr>`; })}
      </tbody></table></div></section>
  </div>`;
}

/* ---------------- overview ---------------- */
function Overview({ go }) {
  const id = "CASE-0153";
  const rider = agentOut(id, "rider_advocate"), driverArg = agentOut(id, "driver_advocate");
  const dec = decisionOf(id);
  const queue = D.queue;
  const safetyN = queue.filter((q) => q.is_safety).length;
  const highN = queue.filter((q) => (q.escalation && q.escalation.bucket_escalate) && !q.is_safety).length;
  const otherN = queue.length - safetyN - highN;
  const g = D.golden;
  const mini = [["msg", "Report received", "", "ai"], ["list", "Triage", secs(usageOf(id, "triage")[0].latency_ms), "ai"], ["check", "Prevention rules", "no AI", "rule"], ["search", "Evidence collected", secs(usageOf(id, "evidence_collection")[0].latency_ms), "ai"], ["scale", "Advocates argue", secs(agentEvent(id, "rider_advocate").latency_ms), "ai"], ["gavel", "Judge rules", secs(agentEvent(id, "judge").latency_ms), "ai"], ["check", "Gates pass", "no AI", "rule"]];
  return html`<div>
    <section class="ov-hero">
      <div>
        <h1>Every ride dispute,<br />heard fairly.</h1>
        <p class="lede">One AI advocate for the <span style=${{ color: "var(--rider)", fontWeight: 600 }}>rider</span>, one for the <span style=${{ color: "var(--driver)", fontWeight: 600 }}>driver</span>, a judge that cites every fact, and plain-code checks that hand anything uncertain or unsafe to a person.</p>
        <div class="ctas"><button class="btn btn-primary" onClick=${() => go("rider")}><${Icon} name="phone" size=${16} />File as a rider</button><button class="btn btn-primary" onClick=${() => go("driver", null, false, { start: "file" })}><${Icon} name="car" size=${16} />File as a driver</button><button class="btn btn-quiet" onClick=${() => go("trace", id, true)}><${Icon} name="play" size=${15} />Watch a hearing</button></div>
      </div>
      <div class="hero-visual">
        <${Phone} small=${true}><${Outcome} caseId=${id} who="rider" onRestart=${() => go("rider")} /><//>
        <div class="mini-trace"><h3>Behind that screen</h3>
          ${mini.map(([ic, l, t, k]) => html`<div key=${l} class=${`mini-row ${k}`}><span class="mi"><${Icon} name=${ic} size=${12} stroke=${2.4} /></span><span>${l}</span><span class="mt">${t}</span></div>`)}
          <button class="btn btn-quiet btn-sm" style=${{ alignSelf: "flex-start", marginTop: 6 }} onClick=${() => go("trace", id)}>Open the full trace <${Icon} name="arrow" size=${14} /></button>
        </div>
      </div>
    </section>
    <section class="ov-band">
      <div><h2>Both sides get an advocate.</h2><p class="lede">Two agents argue the same case from the identical evidence file. Every factual claim has to cite a real item in it, or it's stripped.</p></div>
      <div style=${{ display: "flex", flexDirection: "column", gap: 14 }}>
        <div class="debate">${[["rider", rider, "Rider's advocate"], ["driver", driverArg, "Driver's advocate"]].map(([r, a, t]) => html`<div key=${r} class=${`side ${r}`} style=${{ background: "var(--surface)" }}><span class="party ${r}"><i></i>${t}</span><p>${a.text.split(/(?<=[.!?])\s+(?=[A-Z])/).slice(0, 2).join(" ")}</p><div>${a.cites.slice(0, 4).map((x) => html`<${Cite} key=${x} caseId=${id} refId=${x} />`)}</div></div>`)}</div>
        <div class="verdict"><div class="verdict-head"><div><p class="small muted">The Judge, who never reads the complaint</p><h4>${OUTCOME[dec.outcome]} · ${money(dec.remedy.amount)} refund</h4></div><button class="btn btn-secondary btn-sm" onClick=${() => go("trace", id)}>See the ruling</button></div></div>
      </div>
    </section>
    <section class="ov-band">
      <div><h2>Some decisions belong to people.</h2><p class="lede">Plain-code checks run on every decision, whatever the AI says. Right now ${queue.length} cases wait for a person.</p></div>
      <div class="people-list">
        <div class="people-row"><b style=${{ color: "var(--bad)" }}>${safetyN}</b><div><h3>Safety reports</h3><p>Never seen by any agent. They go straight to the safety team.</p></div><span></span></div>
        <div class="people-row"><b style=${{ color: "var(--warn)" }}>${highN}</b><div><h3>High stakes and repeat filers</h3><p>Cleaning fees of $120 or more, and anyone with three disputes in 30 days.</p></div><span></span></div>
        <div class="people-row"><b>${otherN}</b><div><h3>Rule checks and uncertain calls</h3><p>Confidence under 0.60, a Judge asking for help, or a remedy that breaks a policy cap.</p></div><span></span></div>
        <div style=${{ paddingTop: 18 }}><button class="btn btn-secondary" onClick=${() => go("support")}>Open the support console</button></div>
      </div>
    </section>
    <section class="ov-band">
      <div><h2>Measured, not claimed.</h2><p class="lede">${g.total} labelled cases, filed through the full pipeline with real model calls. Each verdict is checked against its label down to the cent.</p></div>
      <div style=${{ display: "flex", flexDirection: "column", gap: 22 }}>
        <div class="acc-big">${g.passed}/${g.total}</div>
        <div class="cat-bars">${Object.entries(g.by_category).map(([k, b]) => html`<div key=${k} class="cat-bar"><span>${CAT_FULL[k]}</span><span class="bar"><i style=${{ width: `${(b.passed / b.run) * 100}%` }}></i></span><span class="num" style=${{ textAlign: "right" }}>${b.passed}/${b.run}</span></div>`)}</div>
        <div><button class="btn btn-secondary" onClick=${() => go("accuracy")}>See every case</button></div>
      </div>
    </section>
    <section class="ov-band" style=${{ paddingBottom: 40 }}>
      <div><h2>Four apps, one system.</h2><p class="lede">Each role gets its own app. All of them run on the same cases.</p></div>
      <div class="doors">
        ${[["phone", "Rider app", "File a dispute from a trip and follow it to the outcome.", "rider"], ["car", "Driver app", "Answer a report, or follow your own cleaning-fee claim.", "driver"], ["headset", "Support console", "Decide what the checks flagged. Evidence first, AI second.", "support"], ["activity", "AI trace", "Every agent, every citation, every rule, for any case.", "trace"]].map(([ic, t, d, to]) => html`<button key=${t} class="door" onClick=${() => go(to)}><span class="di"><${Icon} name=${ic} size=${22} /></span><span><h3>${t}</h3><p>${d}</p></span><${Icon} name="right" size=${18} style=${{ color: "var(--ink-4)" }} /></button>`)}
      </div>
    </section>
    <footer class="ov-foot">RydeResolve is a dispute resolution system built for Ryde, for the Tencent hackathon. It isn't an official Ryde product. All riders, drivers and trips are synthetic. Cases, arguments, rulings and timings are real output of the pipeline, captured on 11 Oct 2026.</footer>
  </div>`;
}

/* ---------------- shell ---------------- */
const APPS = [["overview", "Overview"], ["rider", "Rider app"], ["driver", "Driver app"], ["support", "Support"], ["trace", "AI trace"]];
function App() {
  const initial = (location.hash || "#overview").slice(1);
  const [app, setApp] = useState(["overview", "rider", "driver", "support", "trace", "accuracy"].includes(initial) ? initial : "overview");
  const [traceCase, setTraceCase] = useState("CASE-0153");
  const [drawer, setDrawer] = useState(null);
  const [autoReplay, setAutoReplay] = useState(0);
  const [driverStart, setDriverStart] = useState({ start: null, n: 0 });
  const go = useCallback((to, caseId, replay, opts) => {
    if (caseId) setTraceCase(caseId);
    if (to === "driver") setDriverStart((d) => ({ start: (opts && opts.start) || null, n: d.n + 1 }));
    if (replay) setAutoReplay((n) => n + 1);
    setApp(to);
    try { history.replaceState(null, "", `#${to}`); } catch (e) {}
    window.scrollTo({ top: 0 });
  }, []);
  const ctx = useMemo(() => ({ open: (caseId, refId) => setDrawer({ caseId, refId }) }), []);
  const tab = app === "accuracy" ? "accuracy" : "cases";
  const navApp = app === "accuracy" ? "trace" : app;
  return html`<${EvidenceCtx.Provider} value=${ctx}>
    <header class="topbar"><div class="topbar-in">
      <button class="brand" onClick=${() => go("overview")}><${Mark} />RydeResolve</button>
      <nav class="nav" aria-label="Apps">${APPS.map(([k, l]) => html`<button key=${k} aria-current=${navApp === k ? "page" : undefined} onClick=${() => go(k)}>${l}</button>`)}</nav>
      <span class="spacer"></span><span class="note">Prototype · synthetic people, real pipeline output</span>
    </div></header>
    <main>
      ${app === "overview" && html`<${Overview} go=${go} />`}
      ${app === "rider" && html`<${RiderApp} go=${go} />`}
      ${app === "driver" && html`<${DriverApp} key=${driverStart.n} go=${go} start=${driverStart.start} />`}
      ${app === "support" && html`<${SupportConsole} go=${go} />`}
      ${(app === "trace" || app === "accuracy") && html`<${TraceWithReplay} key=${autoReplay} caseId=${traceCase} setCase=${setTraceCase} tab=${tab} setTab=${(t) => go(t === "accuracy" ? "accuracy" : "trace")} replay=${autoReplay > 0} />`}
    </main>
    <${Drawer} state=${drawer} onClose=${() => setDrawer(null)} />
  <//>`;
}
function TraceWithReplay(props) {
  useEffect(() => {
    if (!props.replay) return;
    const t = setTimeout(() => { const b = document.querySelector(".trace-head .btn-primary"); if (b) b.click(); }, 350);
    return () => clearTimeout(t);
  }, []);
  return html`<${TraceApp} ...${props} />`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
