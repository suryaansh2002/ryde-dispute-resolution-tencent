<title>RydeResolve</title>
<meta name="description" content="Interactive prototype of RydeResolve: rider and driver apps, the support console, and the AI hearing, on real pipeline data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: an Apple-calm product world. Grey ground, white sheets, one ink.
   Colour only does jobs: violet = rider, teal = driver, green/amber/red = outcome state,
   blue = links and focus. Deliberately a single light theme, for a consistent recording. */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-2: #fbfbfd;
  --fill: #ececf0;
  --fill-2: #e3e3e8;
  --line: #d2d2d7;
  --hair: #e8e8ed;
  --ink: #1d1d1f;
  --ink-2: #424245;
  --ink-3: #6e6e73;
  --ink-4: #8a8a8f;
  --link: #0066cc;
  --focus: #0071e3;
  --rider: #6e4fd8;
  --rider-soft: #f2eefd;
  --driver: #087a8c;
  --driver-soft: #e5f3f5;
  --good: #1d7f3a;
  --good-soft: #e8f5eb;
  --warn: #a85400;
  --warn-soft: #fcf0e1;
  --bad: #c8102e;
  --bad-soft: #fcebed;
  --map: #eef0f3;
  --map-grid: #e2e5ea;
  --shadow: 0 1px 2px rgb(0 0 0 / 4%), 0 8px 24px rgb(0 0 0 / 6%);
  --shadow-lift: 0 2px 6px rgb(0 0 0 / 6%), 0 24px 48px rgb(0 0 0 / 12%);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.47;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 0;
}
::selection { background: color-mix(in srgb, var(--focus) 22%, transparent); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent); outline-offset: 2px; border-radius: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--link); text-underline-offset: 3px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-family: var(--font-display); }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: -0.01em; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hair);
}
.topbar-in { max-width: 1320px; margin: 0 auto; padding: 0 24px; height: 52px; display: flex; align-items: center; gap: 24px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; background: none; border: 0; padding: 0; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; background: var(--ink); display: grid; place-items: center; }
.nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 0 1 auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
@media (max-width: 1000px) { .topbar .note { display: none; } .topbar-in { gap: 12px; padding: 0 16px; } }
.nav button { border: 0; background: none; padding: 7px 12px; border-radius: 980px; font-size: 14px; color: var(--ink-3); white-space: nowrap; transition: background .15s, color .15s; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--fill); font-weight: 500; }
.topbar .spacer { flex: 1; }
.topbar .note { font-size: 12px; color: var(--ink-4); white-space: nowrap; }

/* ---------- shared atoms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 980px; padding: 11px 20px; font-size: 15px; font-weight: 500; transition: background .15s, transform .15s; text-decoration: none; }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #333336; }
.btn-secondary { background: var(--fill); color: var(--ink); }
.btn-secondary:hover { background: var(--fill-2); }
.btn-quiet { background: none; color: var(--link); padding-inline: 4px; }
.btn-quiet:hover { text-decoration: underline; }
.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
kbd { font-family: var(--font); font-size: 11px; color: var(--ink-3); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; margin-left: 2px; }
.btn-primary kbd { background: transparent; color: #c7c7cc; border-color: #4a4a4f; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px 3px 8px; border-radius: 980px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.neutral { color: var(--ink-2); background: var(--fill); }
.pill.live { color: var(--ink-2); background: var(--fill); }
.pill.live::before { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

.party { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
.party i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.party.rider { --c: var(--rider); }
.party.driver { --c: var(--driver); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.avatar.rider { background: var(--rider-soft); color: var(--rider); }
.avatar.driver { background: var(--driver-soft); color: var(--driver); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink-3); background: var(--fill); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag.rule { background: none; border: 1px dashed var(--line); }

/* citation chip: the signature move */
.cite { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px 1px 6px; margin: 1px 2px; vertical-align: 1px; transition: border-color .15s, background .15s, box-shadow .15s; }
.cite:hover, .cite:focus-visible { border-color: var(--ink-3); background: var(--surface-2); box-shadow: 0 1px 4px rgb(0 0 0 / 8%); }
.cite svg { color: var(--ink-4); }
.cite.policy { border-style: dashed; }
.popover { position: fixed; z-index: 60; width: 300px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-lift); border: 1px solid var(--hair); padding: 12px; pointer-events: none; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.popover-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--ink-3); }

/* ---------- page frames ---------- */
.page { max-width: 1320px; margin: 0 auto; padding: 32px 24px 96px; }
.stage { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 48px; align-items: start; }
@media (max-width: 900px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.narration { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 22px; }
.persona { display: flex; align-items: center; gap: 12px; }
.persona h1 { font-size: 22px; letter-spacing: -0.02em; }
.scenarios { display: flex; flex-direction: column; gap: 4px; }
.scenarios h2 { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-bottom: 4px; font-family: var(--font); }
.scenario { text-align: left; background: none; border: 0; border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; transition: background .15s; }
.scenario:hover { background: var(--fill); }
.scenario[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.scenario .radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 2px; display: grid; place-items: center; }
.scenario[aria-pressed="true"] .radio { border-color: var(--ink); }
.scenario[aria-pressed="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.scenario strong { display: block; font-size: 14px; font-weight: 600; }
.scenario span { font-size: 13px; color: var(--ink-3); }
.caption { background: var(--surface); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.caption h3 { font-size: 15px; font-family: var(--font); font-weight: 600; }
.caption p { font-size: 14px; color: var(--ink-2); }
.steps-dots { display: flex; gap: 6px; }
.steps-dots i { height: 4px; flex: 1; border-radius: 4px; background: var(--fill-2); transition: background .25s; }
.steps-dots i.on { background: var(--ink); }

/* ---------- phone ---------- */
.phone-wrap { display: flex; justify-content: center; }
.phone { width: min(390px, 100%); height: 820px; border-radius: 58px; background: #0b0b0c; padding: 13px; box-shadow: 0 0 0 1px #2a2a2c, 0 30px 70px rgb(0 0 0 / 22%), 0 8px 20px rgb(0 0 0 / 12%); position: relative; flex: none; }
.phone-screen { height: 100%; border-radius: 46px; overflow: hidden; background: var(--surface-2); position: relative; display: flex; flex-direction: column; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; background: #000; border-radius: 20px; z-index: 5; }
.statusbar { height: 54px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 8px 36px; font-size: 15px; font-weight: 600; }
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.app-view { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.app-head { padding: 6px 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.app-head h2 { font-size: 30px; letter-spacing: -0.025em; font-weight: 700; }
.app-head .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--link); font-size: 16px; padding: 4px 0; margin-left: -6px; }
.app-body { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.sheet { background: var(--surface); border-radius: 18px; overflow: hidden; }
.sheet-pad { padding: 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; }
.row + .row { border-top: 1px solid var(--hair); }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 16px; font-weight: 500; }
.row .sub { font-size: 13px; color: var(--ink-3); }
button.row { width: 100%; border: 0; background: none; text-align: left; }
button.row:hover { background: var(--surface-2); }
.choice { width: 100%; border: 0; background: var(--surface); text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px 16px; font-size: 16px; }
.choice + .choice { border-top: 1px solid var(--hair); }
.choice[aria-checked="true"] { background: color-mix(in srgb, var(--fill) 60%, var(--surface)); }
.choice .check { margin-left: auto; color: var(--ink); }
.field-label { font-size: 13px; color: var(--ink-3); padding: 0 4px 6px; }
textarea.input { width: 100%; min-height: 128px; resize: none; border: 0; border-radius: 18px; padding: 14px 16px; font: inherit; font-size: 16px; line-height: 1.45; background: var(--surface); color: var(--ink); }
textarea.input:focus { outline: 2px solid color-mix(in srgb, var(--focus) 45%, transparent); }
.app-footer { padding: 12px 16px 26px; background: linear-gradient(to top, var(--surface-2) 70%, transparent); position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; }
.attached { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.attached + .attached { border-top: 1px solid var(--hair); }
.attached .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--fill); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.attached .ok { margin-left: auto; color: var(--good); }

.hero-result { padding: 8px 4px 4px; display: flex; flex-direction: column; gap: 10px; }
.hero-result .badge-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; }
.hero-result h3 { font-size: 30px; letter-spacing: -0.03em; line-height: 1.08; font-weight: 700; }
.hero-result p { color: var(--ink-2); font-size: 16px; }
.facts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.facts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 12px 16px; font-size: 15px; }
.facts li + li { border-top: 1px solid var(--hair); }
.facts li svg { margin-top: 2px; color: var(--ink-3); }
.sheet h4 { font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 14px 16px 0; font-family: var(--font); }
.quote-box { padding: 10px 16px 14px; font-size: 15px; color: var(--ink-2); }
.rule-box { padding: 12px 16px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.tracker { list-style: none; margin: 0; padding: 6px 0; }
.tracker li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 10px 16px; position: relative; }
.tracker li::before { content: ""; position: absolute; left: 29px; top: 34px; bottom: -10px; width: 2px; background: var(--fill-2); }
.tracker li:last-child::before { display: none; }
.tracker li.done::before { background: var(--ink); }
.tracker .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-4); transition: background .25s, color .25s; position: relative; z-index: 1; }
.tracker li.done .dot { background: var(--ink); color: #fff; }
.tracker li.now .dot { background: var(--surface); box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
.tracker li.now .dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--ink); opacity: .2; animation: ring 1.4s ease-out infinite; }
@keyframes ring { from { transform: scale(.85); opacity: .35; } to { transform: scale(1.25); opacity: 0; } }
.tracker .lbl { font-size: 15px; font-weight: 500; padding-top: 3px; }
.tracker .lbl small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-3); }
.tracker li:not(.done):not(.now) .lbl { color: var(--ink-4); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; background: var(--surface); }
.notice .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }

/* ---------- maps ---------- */
.map { display: block; width: 100%; height: auto; background: var(--map); }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-3); padding: 8px 14px 10px; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- desktop apps ---------- */
.console { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .console { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
.panel-head h2 { font-size: 17px; font-family: var(--font); font-weight: 600; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-title h1 { font-size: 34px; letter-spacing: -0.03em; font-weight: 700; }
.page-title p { color: var(--ink-3); font-size: 16px; max-width: 60ch; margin-top: 4px; }
.queue-item { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 13px 20px; border-top: 1px solid var(--hair); position: relative; }
.queue-item:hover { background: var(--surface-2); }
.queue-item[aria-current="true"] { background: var(--fill); }
.queue-item .t { font-weight: 600; font-size: 15px; }
.queue-item .m { font-size: 13px; color: var(--ink-3); }
.queue-item .r { text-align: right; font-size: 13px; color: var(--ink-3); }
.section { padding: 20px 24px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 14px; }
.section h3 { font-size: 15px; font-family: var(--font); font-weight: 600; display: flex; align-items: center; gap: 10px; }
.bubbles { display: flex; flex-direction: column; gap: 8px; }
.bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
.bubble.rider { background: var(--rider-soft); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.driver { background: var(--driver-soft); align-self: flex-end; border-bottom-right-radius: 6px; }
.bubble.hl { box-shadow: 0 0 0 2px var(--ink); }
.bubble .who { font-size: 11px; font-weight: 600; color: var(--ink-3); margin-bottom: 2px; display: flex; gap: 8px; }
.photo { position: relative; border-radius: 14px; overflow: hidden; background: var(--fill); }
.photo img { display: block; width: 100%; height: auto; transition: filter .25s; }
.photo.blur img { filter: blur(22px) saturate(.6); transform: scale(1.08); }
.photo .reveal { position: absolute; inset: 0; display: grid; place-items: center; background: none; border: 0; color: #fff; font-weight: 600; text-shadow: 0 1px 6px rgb(0 0 0 / 50%); }
.debate { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .debate { grid-template-columns: minmax(0, 1fr); } }
.side { border-radius: 16px; padding: 16px; background: var(--surface-2); border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side.rider, .side.driver { border-top: 1px solid var(--hair); }
.side p { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.more-btn { border: 0; background: none; padding: 0; color: var(--link); font-size: 13px; align-self: flex-start; }
.verdict { border-radius: 16px; background: var(--surface); border: 1px solid var(--hair); overflow: hidden; }
.verdict-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; flex-wrap: wrap; }
.verdict-head h4 { font-size: 22px; letter-spacing: -0.02em; font-weight: 700; }
.findings { margin: 0; padding: 0 20px 18px; list-style: none; counter-reset: f; display: flex; flex-direction: column; gap: 12px; }
.findings li { counter-increment: f; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.findings li::before { content: counter(f); width: 22px; height: 22px; border-radius: 50%; background: var(--fill); color: var(--ink-3); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.conf { display: flex; flex-direction: column; gap: 6px; min-width: 200px; }
.conf-track { height: 6px; border-radius: 6px; background: var(--fill); position: relative; }
.conf-fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--ink); }
.conf-tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--warn); border-radius: 2px; }
.conf-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .checks { grid-template-columns: minmax(0, 1fr); } }
.check-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--hair); font-size: 14px; }
.check-row .ci { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.check-row.pass .ci { background: var(--good-soft); color: var(--good); }
.check-row.flag .ci { background: var(--warn-soft); color: var(--warn); }
.check-row small { display: block; color: var(--ink-3); font-size: 13px; }
.actionbar { position: sticky; bottom: 16px; margin: 0 16px 16px; padding: 12px 14px 12px 20px; border-radius: 16px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow-lift); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actionbar .grow { flex: 1; min-width: 180px; font-size: 13px; color: var(--ink-3); }
.reasons { display: flex; flex-wrap: wrap; gap: 8px; }
.reasons button { border: 1px solid var(--line); background: var(--surface); border-radius: 980px; padding: 7px 14px; font-size: 13px; }
.reasons button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 70; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow-lift); display: flex; gap: 10px; align-items: center; animation: rise .2s ease-out; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
.reveal-ai { border: 1px dashed var(--line); border-radius: 16px; padding: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--surface-2); }

/* ---------- trace ---------- */
.case-list { max-height: calc(100vh - 170px); overflow-y: auto; padding-bottom: 8px; }
.trace-head { padding: 24px 28px 8px; display: flex; flex-direction: column; gap: 10px; }
.trace-head h2 { font-size: 28px; letter-spacing: -0.025em; font-weight: 700; }
.stats { display: flex; gap: 28px; flex-wrap: wrap; padding: 6px 28px 18px; }
.stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }
.pipeline { display: flex; align-items: center; gap: 0; padding: 16px 28px 22px; overflow-x: auto; }
.node { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 88px; flex: none; }
.node-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-4); transition: background .3s, color .3s, box-shadow .3s; position: relative; }
.node.rule .node-ic { border-radius: 11px; transform: rotate(45deg); }
.node.rule .node-ic > svg { transform: rotate(-45deg); }
.node.person .node-ic { border-radius: 12px; }
.node.done .node-ic { background: var(--ink); color: #fff; }
.node.flag .node-ic { background: var(--warn); color: #fff; }
.node.stop .node-ic { background: var(--bad); color: #fff; }
.node.now .node-ic { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.node.now .node-ic::after { content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid var(--ink); animation: ring 1.4s ease-out infinite; }
.node .nl { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.25; }
.node .nt { font-size: 11px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.node.idle .nl { color: var(--ink-4); }
.link { height: 2px; min-width: 18px; flex: 1; background: var(--fill-2); margin-bottom: 36px; transition: background .3s; }
.link.on { background: var(--ink); }
.timeline { padding: 4px 28px 32px; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; padding-bottom: 26px; position: relative; animation: settle .35s ease-out both; }
@keyframes settle { from { opacity: 0; transform: translateY(6px); } }
.step::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 2px; background: var(--hair); }
.step:last-child::before { display: none; }
.step-ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--hair); color: var(--ink-2); }
.step.rule .step-ic { border-style: dashed; border-radius: 12px; }
.step-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding-top: 2px; }
.step-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.step-title h3 { font-size: 17px; font-family: var(--font); font-weight: 600; }
.step-title .t { margin-left: auto; font-size: 12px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
details.more summary { cursor: pointer; font-size: 13px; color: var(--link); list-style: none; display: inline-flex; gap: 4px; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary svg { transform: rotate(90deg); }
details.more .more-body { margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--hair); }
.evidence-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.hearing-note { font-size: 13px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 18%); z-index: 50; animation: fade .15s ease-out; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--surface); z-index: 51; box-shadow: var(--shadow-lift); display: flex; flex-direction: column; animation: slide .22s cubic-bezier(.2, .8, .2, 1); }
@keyframes slide { from { transform: translateX(28px); opacity: .4; } }
.drawer-head { padding: 20px 24px 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; border-bottom: 1px solid var(--hair); }
.drawer-head h2 { font-size: 20px; letter-spacing: -0.02em; }
.drawer-body { padding: 20px 24px 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.close { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; flex: none; }

/* ---------- overview ---------- */
.ov-hero { max-width: 1320px; margin: 0 auto; padding: 72px 24px 40px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 560px); gap: 56px; align-items: center; }
@media (max-width: 1080px) { .ov-hero { grid-template-columns: minmax(0, 1fr); } }
.ov-hero h1 { font-size: clamp(2.75rem, 5.4vw, 4.75rem); line-height: 1.02; letter-spacing: -0.035em; font-weight: 700; }
.ov-hero h1 .r { color: var(--rider); }
.ov-hero h1 .d { color: var(--driver); }
.ov-hero .lede { font-size: 21px; line-height: 1.42; color: var(--ink-2); max-width: 34ch; margin-top: 22px; letter-spacing: -0.01em; }
.ov-hero .ctas { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; align-items: center; }
.ov-hero .ctas .btn { padding: 13px 24px; font-size: 16px; }
.hero-visual { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
@media (max-width: 640px) { .hero-visual { grid-template-columns: minmax(0, 1fr); justify-items: center; } }
.hero-visual .phone { width: 300px; height: 630px; border-radius: 46px; padding: 10px; }
.hero-visual .phone-screen { border-radius: 37px; }
.hero-visual .island { width: 92px; height: 27px; top: 9px; }
.hero-visual .statusbar { height: 44px; font-size: 13px; padding: 0 24px 6px 28px; }
.hero-visual .app-head h2 { font-size: 24px; }
.hero-visual .hero-result h3 { font-size: 24px; }
.mini-trace { display: flex; flex-direction: column; gap: 2px; background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.mini-trace h3 { font-size: 14px; font-family: var(--font); font-weight: 600; padding: 2px 4px 8px; }
.mini-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; font-size: 13px; }
.mini-row .mi { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
.mini-row.rule .mi { border-radius: 7px; background: var(--fill); color: var(--ink-2); }
.mini-row .mt { color: var(--ink-4); font-variant-numeric: tabular-nums; font-size: 12px; }
.ov-band { max-width: 1320px; margin: 0 auto; padding: 72px 24px; display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 56px; align-items: start; border-top: 1px solid var(--hair); }
@media (max-width: 980px) { .ov-band { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.ov-band h2 { font-size: clamp(2rem, 3.4vw, 3rem); line-height: 1.06; letter-spacing: -0.03em; font-weight: 700; }
.ov-band .lede { font-size: 18px; color: var(--ink-2); margin-top: 16px; max-width: 40ch; }
.people-list { display: flex; flex-direction: column; }
.people-row { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 20px 0; border-top: 1px solid var(--hair); }
.people-row:first-child { border-top: 0; }
.people-row b { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.people-row h3 { font-size: 18px; font-family: var(--font); font-weight: 600; }
.people-row p { color: var(--ink-3); font-size: 15px; }
.acc-big { font-size: clamp(4.5rem, 10vw, 8rem); font-weight: 700; letter-spacing: -0.05em; line-height: .9; font-variant-numeric: tabular-nums; }
.cat-bars { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.cat-bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) 54px; gap: 14px; align-items: center; font-size: 15px; }
.cat-bar .bar { height: 8px; border-radius: 8px; background: var(--fill); position: relative; overflow: hidden; }
.cat-bar .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 8px; }
.doors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--hair); }
@media (max-width: 760px) { .doors { grid-template-columns: minmax(0, 1fr); } }
.door { text-align: left; border: 0; background: none; padding: 26px 4px 26px 0; display: grid; grid-template-columns: 52px minmax(0, 1fr) 20px; gap: 18px; align-items: center; border-bottom: 1px solid var(--hair); }
.door:hover h3 { text-decoration: underline; text-underline-offset: 4px; }
.door .di { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.door h3 { font-size: 19px; font-family: var(--font); font-weight: 600; }
.door p { font-size: 15px; color: var(--ink-3); }
.ov-foot { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; color: var(--ink-4); font-size: 13px; border-top: 1px solid var(--hair); }

/* tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12px; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
.tbl td { padding: 12px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.subnav { display: inline-flex; background: var(--fill); padding: 3px; border-radius: 980px; gap: 2px; }
.subnav button { border: 0; background: none; padding: 6px 14px; border-radius: 980px; font-size: 13px; color: var(--ink-3); }
.subnav button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgb(0 0 0 / 8%); }

/* chat intake */
.chatlog { flex: 1; overflow-y: auto; padding: 4px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 84%; padding: 10px 14px; border-radius: 20px; font-size: 15px; line-height: 1.4; animation: settle .25s ease-out both; }
.msg.bot { background: var(--surface); align-self: flex-start; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.msg.me { align-self: flex-end; color: #fff; border-bottom-right-radius: 6px; }
.msg.me.rider { background: var(--rider); }
.msg.me.driver { background: var(--driver); }
.msg.me.photo-msg { padding: 4px; background: var(--surface); width: 62%; }
.msg.me.photo-msg img { display: block; width: 100%; border-radius: 16px; }
.msg-attach { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--hair); font-size: 13px; color: var(--ink-2); }
.msg-attach span { display: inline-flex; align-items: center; gap: 8px; }
.msg.typing { display: flex; gap: 4px; padding: 14px 16px; }
.msg.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); animation: blink 1s infinite; }
.msg.typing i:nth-child(2) { animation-delay: .15s; } .msg.typing i:nth-child(3) { animation-delay: .3s; }
.quick { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-top: 4px; }
.quick button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 980px; padding: 8px 14px; font-size: 14px; }
.quick button:hover { border-color: var(--ink-3); }
.quick button.safety { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.msg-action { align-self: flex-end; display: inline-flex; gap: 8px; align-items: center; border: 0; background: var(--ink); color: #fff; border-radius: 980px; padding: 9px 16px; font-size: 14px; }
.composer { padding: 8px 12px 22px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--hair); background: var(--surface-2); }
.use-example { align-self: flex-start; border: 0; background: none; color: var(--link); font-size: 13px; padding: 2px 4px; }
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px; font: inherit; font-size: 15px; background: var(--surface); color: var(--ink); }
.composer textarea:focus { outline: 2px solid color-mix(in srgb, var(--focus) 40%, transparent); }
.send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { background: var(--fill-2); color: var(--ink-4); }
/* policy */
.clause { border-radius: 14px; border: 1px solid var(--hair); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); }
.clause.cited { background: var(--surface); border-color: var(--ink-3); box-shadow: 0 1px 4px rgb(0 0 0 / 6%); }
.clause-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-weight: 600; }
.md { font-size: 14px; line-height: 1.6; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; }
.md p, .md ul { margin: 0; }
.md ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.md strong { color: var(--ink); font-weight: 600; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--fill); padding: 1px 5px; border-radius: 5px; }
.md-table { overflow-x: auto; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; }
.md th { text-align: left; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.md td { padding: 7px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
/* courtroom trace */
.docket { letter-spacing: 0.01em; }
.caption-title { font-size: 28px; letter-spacing: -0.025em; font-weight: 700; }
.caption-title .vs { color: var(--ink-4); font-weight: 400; font-style: italic; padding: 0 4px; }
.party-name.rider { box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--rider) 35%, transparent); }
.party-name.driver { box-shadow: inset 0 -3px 0 color-mix(in srgb, var(--driver) 35%, transparent); }
.courtroom { display: flex; flex-direction: column; gap: 14px; }
.bench-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: #fff; }
.bench-bar span:first-child { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.bench-bar .muted { color: #c7c7cc; }
.counsel { background: var(--surface); }
.verdict.bench { border-color: var(--ink-3); }
.findings-title { font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 0 20px 10px; }
.exhibits { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 14px; }
.exhibits .cite { white-space: nowrap; }
.exhibits li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
.ex-no { min-width: 68px; font-variant-numeric: tabular-nums; }
/* safety prep */
.prep-run { display: flex; align-items: center; gap: 12px; padding: 18px; border-radius: 16px; border: 1px dashed var(--line); color: var(--ink-2); font-size: 14px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fill-2); border-top-color: var(--ink); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.prepared { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 16px; border: 1px solid var(--hair); background: var(--surface-2); }
.prepared-head { display: flex; align-items: center; gap: 10px; }
.timeline-mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.timeline-mini li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; }
.timeline-mini .tm { color: var(--ink-3); font-variant-numeric: tabular-nums; }

.stage.three { grid-template-columns: minmax(0, 290px) 390px minmax(0, 1fr); gap: 40px; }
@media (max-width: 1240px) { .stage.three { grid-template-columns: minmax(0, 290px) minmax(0, 1fr); } .stage.three .demo-panel { grid-column: 1 / -1; position: static; } }
@media (max-width: 900px) { .stage.three { grid-template-columns: minmax(0, 1fr); } }
.demo-panel { position: sticky; top: 84px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dp-head h2 { font-size: 17px; font-family: var(--font); font-weight: 600; }
.dp-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.dp-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; position: relative; }
.dp-row:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 32px; bottom: -4px; width: 2px; background: var(--hair); }
.dp-row.done:not(:last-child)::after { background: var(--ink); }
.dp-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--ink-4); position: relative; z-index: 1; transition: background .3s, color .3s; }
.dp-row.rule .dp-ic { border-radius: 8px; }
.dp-row.done .dp-ic { background: var(--ink); color: #fff; }
.dp-row.flag .dp-ic { background: var(--warn); color: #fff; }
.dp-row.stop .dp-ic { background: var(--bad); color: #fff; }
.dp-row.now .dp-ic { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.dp-row.now .dp-ic::after { content: ""; position: absolute; inset: -5px; border-radius: inherit; border: 2px solid var(--ink); animation: ring 1.4s ease-out infinite; }
.dp-l { font-size: 14px; font-weight: 500; padding-top: 3px; }
.dp-row.idle .dp-l { color: var(--ink-4); }
.dp-l small { display: block; font-weight: 400; font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.dp-t { font-size: 12px; color: var(--ink-4); padding-top: 5px; font-variant-numeric: tabular-nums; }
.dp-sum { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--hair); align-items: flex-start; }

/* transcript (overview) */
.transcript { display: flex; flex-direction: column; gap: 26px; max-width: 64ch; }
.tq { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.tq figcaption { font-size: 14px; }
.tq blockquote { margin: 0; font-family: var(--font-display); font-size: 23px; line-height: 1.38; letter-spacing: -0.015em; color: var(--ink); text-wrap: pretty; }
.fn { border: 0; background: none; padding: 0 1px; margin-left: 1px; font-size: 13px; font-weight: 600; color: var(--link); vertical-align: super; line-height: 0; font-family: var(--font); }
.fn:hover { text-decoration: underline; }
.fn + .fn { margin-left: 4px; }
.ruling-line { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--line); }
.ruling-line p { font-size: 19px; margin-top: 4px; }
.footnotes { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--ink-3); }
/* inbox (support queue, docket) */
.inbox-group { padding: 0 8px 8px; }
.inbox-h { display: flex; justify-content: space-between; font-family: var(--font); font-size: 13px; font-weight: 600; color: var(--ink-3); padding: 14px 12px 6px; border-top: 1px solid var(--hair); }
.inbox-group:first-of-type .inbox-h { border-top: 0; padding-top: 4px; }
.inbox-h span { font-weight: 500; font-variant-numeric: tabular-nums; }
.inbox-row { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; transition: background .12s; }
.inbox-row:hover { background: var(--surface-2); }
.inbox-row[aria-current="true"] { background: var(--fill); }
.inbox-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--fill); color: var(--ink-2); }
.inbox-row[aria-current="true"] .inbox-ic { background: var(--surface); }

.inbox-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

on":41.6,"escalation_reasons":{"risk bucket":5,"compliance veto":1},"trips":200,"users":65},"policy":{"POL-02":[{"chunk_id":"POL-02-01","policy_id":"POL-02","excerpt":"\u00a72. Route Deviation Disputes \u2014 **Grounding, stated up front:** this is the weakest-sourced category in the whole policy. Real Ryde sources confirm that fare *recalculates* when a rider requests a destination change mid-trip and the driver accepts it (a **$3.00** add/edit-destination fee applies, shown on the receipt), and that \"overcharging riders or manipulating fares\" is treated internally as a fraud/account-suspension matter (Driver-Partner Handbook, pp.11\u201313) \u2014 but neither source, nor anything else found, defines a tolerance threshold, a percentage, or a refund formula for the specific case this section actually governs: a driver taking an **unrequested** longer route. That dispute type has no real Ryde-published process at all. Everything below the fee figure is therefore our own invented design, kept because the demo needs an adjudicable rule, not because it reflects Ryde's actual policy \u2014 flagged plainly rather than dressed up as sourced."},{"chunk_id":"POL-02-02","policy_id":"POL-02","excerpt":"\u00a72. Route Deviation Disputes \u2014 **Definition:** a claim that the actual route taken differed materially from the optimal route, without the rider's request or the driver's disclosed justification, resulting in an inflated fare, extended trip time, or both. (This is distinct from a rider-requested, driver-accepted destination change mid-trip \u2014 that's Ryde's real, documented $3.00 add/edit-destination flow, not a dispute, and isn't adjudicated here.)"},{"chunk_id":"POL-02-03","policy_id":"POL-02","excerpt":"\u00a72. Route Deviation Disputes \u2014 **Tolerance thresholds** (not Ryde-sourced \u2014 our own invented tiering, since no real threshold exists), measured as extra distance versus the platform's computed optimal route for the same pickup/dropoff pair:\n\n| Deviation | Outcome |\n|---|---|\n| Under 10% extra distance | No merit \u2014 normal route variance (traffic routing, one-way streets). No refund. |\n| 10%\u201325% extra distance | Partial merit \u2014 refund the fare difference attributable to the extra distance/time, unless justified (see below). |\n| Over 25% extra distance | Full merit \u2014 refund the entire deviation-attributable portion of the fare, unless justified. |"},{"chunk_id":"POL-02-04","policy_id":"POL-02","excerpt":"\u00a72. Route Deviation Disputes \u2014 **Justified deviation exceptions:** a deviation is justified, and no refund is owed regardless of magnitude, if any of the following is evidenced:\n\n- A recorded road closure or traffic incident along the optimal route during the trip window (checked against `traffic_events`).\n  *(Not Ryde-sourced, our own test)*: \"along the optimal route\" means within 2 km of the planned route geometry, with the incident's time window overlapping the trip. It is computed in code, so no agent judges the distance.\n- The rider requested the detour in the chat log (e.g., an added stop, a specific route preference) \u2014 note that a *disclosed and accepted* destination change should route through Ryde's real $3.00 add/edit-destination mechanism above rather than reach this dispute flow at all; this exception exists for the case where the request was informal (chat only, no in-app flow used).\n- A safety-related detour (construction, accident scene, flagged unsafe area)."},{"chunk_id":"POL-02-05","policy_id":"POL-02","excerpt":"\u00a72. Route Deviation Disputes \u2014 If the driver claims a justification but no corresponding evidence exists (no matching `traffic_events` entry, nothing in the chat log), the claim is treated as unjustified \u2014 an unsupported assertion doesn't override the evidentiary standard in \u00a71.\n\n**Refund calculation** (not Ryde-sourced \u2014 our own formula): `refund = (actual_fare \u2212 fare_at_optimal_route) \u00d7 merit_fraction`, where `merit_fraction` is 0.5 for the 10\u201325% tier and 1.0 above 25%."}],"POL-03":[{"chunk_id":"POL-03-01","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 **Definition:** a claim disputing a cancellation or waiting-time fee \u2014 either a rider disputing a fee charged when they say the driver never arrived, or a driver disputing a rider's claim when the driver says they waited as required.\n\n**The real fee and grace-period structure**, per Ryde's Cancellation and Waiting Time Policy:"},{"chunk_id":"POL-03-02","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 | Trip type | Free cancellation window | Grace period once inside that window | Fee if exceeded |\n|---|---|---|---|\n| On-Demand | Within 3 minutes of matching | \u2014 | **$4.50** |\n| Advanced (pre-booked) | More than 15 minutes before pickup | 3 minutes once inside the 15-minute window | **$4.50** |"},{"chunk_id":"POL-03-03","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 The same **$4.50** figure applies to both the cancellation fee and the driver's waiting-time fee \u2014 a driver may charge it after tapping \"I'm Here\" and waiting past 3 minutes, whether the rider eventually boards late or never shows at all. These are real, sourced amounts (help.rydesharing.com, Cancellation and Waiting Time Policy) \u2014 not illustrative."},{"chunk_id":"POL-03-04","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 **Driver no-show (rider's claim):** a cancellation fee is waived, and any fare charged is refunded in full, if the driver did not come within 100 meters of the pickup GPS coordinates at any point during the trip window \u2014 this is checked directly against the GPS trace, not either party's account. *(The 100-meter radius itself is not Ryde-sourced \u2014 no real article gives a distance threshold for \"arrival.\" It's our own design choice, kept because the GPS trace needs some concrete proximity test to check against.)*"},{"chunk_id":"POL-03-05","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 **Minimum wait time:** a driver may cancel and charge the no-show/waiting fee only after waiting at least **3 minutes** at the pickup point (On-Demand), or, for a pre-booked (Advanced) ride, only once the trip is within 15 minutes of the scheduled pickup and a further 3-minute on-site grace period has elapsed \u2014 both real, sourced windows, not invented. If the driver cancelled before the applicable wait elapsed, the fee is waived regardless of whether the rider was actually present \u2014 the driver bears the burden of waiting out the window."},{"chunk_id":"POL-03-06","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 **Rider no-show (driver's claim):** the fee stands if the driver's GPS trace shows arrival within 100 meters of pickup (our own proximity test \u2014 see above), the applicable minimum wait elapsed, and the chat log or call log shows an attempt to reach the rider."},{"chunk_id":"POL-03-07","policy_id":"POL-03","excerpt":"\u00a73. No-Show Charge Disputes \u2014 best-sourced category; real figures throughout except the GPS-radius check \u2014 **Dispute window:** a rider may dispute a cancellation or waiting-time fee within **30 days** of the trip via RydeHELP (real, sourced \u2014 Cancellation Fee Waiver Request / Waiting Fee Waiver Request articles); disputes filed after 30 days are not considered. This is also what Part 2's Rule 6 (claim window) is grounded in for this category."}],"POL-04":[{"chunk_id":"POL-04-01","policy_id":"POL-04","excerpt":"\u00a74. Property Damage / Mess Disputes \u2014 **Definition:** a claim that a rider caused damage or mess (spills, stains, odor, physical damage) requiring a cleaning or repair fee.\n\n**Cleaning/repair fee schedule** \u2014 real, sourced caps (help.rydesharing.com, \"I made a mess in my driver's vehicle\"; matched by Terms of Use Clause 11's $200 ceiling). These are stated as **\"up to\"** amounts, not fixed prices: Ryde \"reviews photos, trip details, and cleaning receipts to determine appropriate amounts within applicable caps\" \u2014 so the table below is the ceiling per tier, not an automatic charge:"},{"chunk_id":"POL-04-02","policy_id":"POL-04","excerpt":"\u00a74. Property Damage / Mess Disputes \u2014 | Severity | Example | Fee (up to) |\n|---|---|---|\n| Minor | Food/drink spillage or crumbs | $40 |\n| Moderate | Bodily fluids or stains (mud, dirt, paint, cement, tar, oil) | $120 |\n| Severe | Vomit | $200 |\n\n**Evidence required:** at least one photo showing the damage/mess. A photo is treated as insufficient evidence (claim declined, not denied \u2014 see \u00a76) if it's a duplicate of a photo used in a prior claim, or automated image analysis flags it as inconsistent with a genuine, unedited photograph. *(There is no photo-submission deadline. An earlier draft required the photo within 2 hours of trip completion. That was an invented placeholder with no Ryde source, and it was dropped on 2026-10-11 so that a claim filed later, still inside the 30-day claim window, isn't declined automatically. Prevention Rule 6's claim window handles staleness.)*"},{"chunk_id":"POL-04-03","policy_id":"POL-04","excerpt":"\u00a74. Property Damage / Mess Disputes \u2014 **Fee for a photo-only claim** *(not Ryde-sourced, our own rule)*: Ryde's real process sets an amount within the cap from photos and cleaning receipts. This system collects photos but not cleaning receipts. An upheld photo-only claim is therefore charged exactly the scheduled amount for the tier the evidence supports: $40 minor, $120 moderate, $200 severe. A missing receipt is not a reason to decline a claim that has a valid photo. Where a cleaning receipt does exist, it can only lower the fee to the receipt amount."},{"chunk_id":"POL-04-04","policy_id":"POL-04","excerpt":"\u00a74. Property Damage / Mess Disputes \u2014 **Which tier the photo supports** *(not Ryde-sourced, our own rule; the tier table itself is Ryde's)*:\n- Automated image analysis says what each photo shows: the kind of mess and how much it covers. The tier follows from the table above: food/drink spillage or crumbs is minor; mud, dirt, stains or bodily fluids other than vomit are moderate; vomit is severe.\n- The tier is set by what the photos show, not by what the claim says. A larger mess claimed than photographed doesn't raise the fee.\n- If the photos show no mess, no cleaning fee is supported.\n- If the analysis is unclear, or not confident, a human reviewer decides the tier. Mirroring Ryde's real appeals process for Vehicle Damage Claims, a receipt must state the cleaning company's name, contact details, cleaning date, and an authorized signature."},{"chunk_id":"POL-04-05","policy_id":"POL-04","excerpt":"\u00a74. Property Damage / Mess Disputes \u2014 **Burden of proof:** the party claiming damage bears the burden. A driver's claim with no photo, or a photo that fails the checks above, is declined for insufficient evidence \u2014 the default is not \"unresolved in the rider's favor,\" it's \"declined, refile with adequate evidence\" (\u00a76). Real-world non-payment consequence, for context (not itself part of this system's remedy set): Ryde places the paying party's account on hold until a cleaning fee is settled."}],"POL-01":[{"chunk_id":"POL-01-01","policy_id":"POL-01","excerpt":"\u00a71. Purpose and General Principles \u2014 This policy governs how disputes between riders and drivers are resolved on the Ryde platform. It applies to Route Deviation, No-Show Charge, and Property Damage claims (Safety Incidents are handled separately \u2014 see \u00a75 below, they are never resolved under this policy)."},{"chunk_id":"POL-01-02","policy_id":"POL-01","excerpt":"\u00a71. Purpose and General Principles \u2014 Four principles apply across every category:\n\n- **Good faith first.** Claims are assessed on their merits, not on which party filed first or how forcefully a claim is worded.\n- **Symmetric treatment.** The same evidentiary standard applies to both riders and drivers making comparable claims \u2014 a rider alleging a driver's fault and a driver alleging a rider's fault face the same bar of proof.\n- **Evidence over assertion.** A claim is decided on trip data, chat logs, timestamps, photos, and account history \u2014 not on the persuasiveness of either party's account alone.\n- **Proportionality.** Remedies scale with the severity and certainty of the finding. Minor, ambiguous cases get minor, reversible remedies; only clear-cut, well-evidenced cases justify larger remedies."}],"POL-05":[{"chunk_id":"POL-05-01","policy_id":"POL-05","excerpt":"\u00a75. Safety Incidents (not resolved under this policy) \u2014 Any claim flagged as a Safety Incident \u2014 by category selection at filing, or by the Triage Agent's classification \u2014 is never adjudicated by this policy or by the Rider/Driver Advocate or Judge agents. It routes directly to a human reviewer (the L2 queue) regardless of the evidence available or the system's confidence. This is a structural rule, not a policy judgment call \u2014 it's enforced in code (see Part 2, Rule 3), not reasoned about by any agent."}],"POL-06":[{"chunk_id":"POL-06-01","policy_id":"POL-06","excerpt":"\u00a76. Evidence Sufficiency Standard \u2014 A claim is **declined** \u2014 not decided against either party \u2014 when the evidence required for its category (per \u00a72\u2013\u00a74 above) isn't present or doesn't meet the stated bar. \"Declined for insufficient evidence\" is a distinct outcome from \"claim denied\": it means the claimant can refile with better evidence, not that the claim was heard and rejected on the merits."}],"POL-07":[{"chunk_id":"POL-07-01","policy_id":"POL-07","excerpt":"\u00a77. Remedy Types and Caps \u2014 Available remedies: full refund, partial refund (fare-difference-based, per \u00a72), compensation credit, cleaning/repair fee charge (per \u00a74), no-show fee waiver, no action. Every remedy is capped at the total fare of the trip in question, except cleaning/repair fees, which follow the schedule in \u00a74 independent of fare size."}],"POL-08":[{"chunk_id":"POL-08-01","policy_id":"POL-08","excerpt":"\u00a78. Escalation Triggers \u2014 A decision routes to human review (L2) instead of being finalized automatically when:\n\n- The category is Safety Incident (\u00a75 \u2014 always, unconditionally).\n- The Judge's confidence in its ruling falls below 0.6 (ties to the two-phase escalation gate, \u00a76.1 of the system design).\n- Either party involved has 3 or more disputes filed against them in the preceding 30 days (ties to Prevention Rule 5's velocity/repeat-filer flag, Part 2 below \u2014 there is no separate Fraud & Bad-Faith Detection Agent in the finalized architecture; this flag is the only mechanism watching for the pattern) \u2014 flagged for human review even if the individual case looks clear-cut, since a pattern across cases is a signal an isolated per-case decision can't see."}]}}</script>

const usageOf = (id, agent) => CASES[id].usage.filter((u) => u.agent === agent);

}

/* ---------------- evidence context: chip, popover, drawer ---------------- */
const EvidenceCtx = createContext({ open: () => {} });
function refKind(ref) {
  if (ref.startsWith("MSG-")) return ["Message", "msg"];
  if (ref.startsWith("EV-")) return ["Photo", "camera"];
  if (ref.startsWith("TRAFFIC-")) return ["Traffic", "alert"];
  if (ref.startsWith("POL-")) return ["Policy", "file"];
  if (ref.startsWith("PROFILE-")) return ["History", "user"];
  if (ref === "PAYMENT") return ["Fare", "receipt"];
  if (ref === "PICKUP-PROXIMITY" || ref === "GPS-TRACE") return ["GPS", "pin"];
  return ["Route", "route"];
}
function policyText(ref) {
  const pid = ref.slice(0, 6);
  const clauses = D.policy[pid] || [];
  const hit = clauses.find((c) => c.chunk_id === ref) || clauses[0];
  return hit ? hit.excerpt.split(" — ").slice(1).join(" — ") || hit.excerpt : "";
}
function Preview({ caseId, refId, compact }) {
  const ev = evOf(caseId)[refId];
  if (refId.startsWith("POL-")) { const [t, sm] = POLICY_INFO[refId.slice(0, 6)] || [refId, ""]; return html`<p class="small" style=${{ color: "var(--ink-2)" }}><strong style=${{ color: "var(--ink)" }}>${t}.</strong> ${sm}</p>`; }
  if (!ev) return html`<p class="small muted">Not part of this case file.</p>`;
  const d = ev.data;
  if (ev.kind === "chat_message") return html`<div class="bubbles"><div class=${`bubble ${d.sender_role}`}><div class="who">${d.sender_role === "rider" ? "Rider" : "Driver"} · ${clock(d.timestamp)}</div>${d.text}</div></div>`;
  if (ev.kind === "photo") return html`<div class="photo"><img src=${d.image} alt="Photo evidence" /></div>${d.analysis && html`<p class="small" style=${{ marginTop: 8 }}>${d.analysis.description}</p>`}`;
  if (ev.kind === "payment") return html`<${Receipt} data=${d} />`;
  if (ev.kind === "route_comparison") return html`<dl class="kv"><dt>Fastest route</dt><dd>${d.optimal_km.toFixed(2)} km</dd><dt>Driven</dt><dd>${d.actual_km.toFixed(2)} km</dd><dt>Extra</dt><dd>+${d.extra_km.toFixed(2)} km (${d.extra_pct.toFixed(1)}%)</dd><dt>Refund if unexplained</dt><dd>${money(d.refund_if_unjustified)}</dd></dl>`;
  if (ev.kind === "pickup_proximity") return html`<dl class="kv"><dt>Closest to pickup</dt><dd>${Math.round(d.closest_approach_m).toLocaleString()} m</dd><dt>Arrival radius</dt><dd>${d.arrival_radius_m} m</dd><dt>Reached pickup</dt><dd>${d.reached_pickup ? "Yes" : "No"}</dd></dl>`;
  if (ev.kind === "traffic_event") return html`<dl class="kv"><dt>Type</dt><dd>${String(d.type).replace("_", " ")}</dd>${d.distance_to_planned_route_m != null && html`<dt>From planned route</dt><dd>${d.distance_to_planned_route_m} m</dd><dt>During the trip</dt><dd>${d.during_trip ? "Yes" : "No"}</dd>`}</dl>`;
  if (ev.kind === "behavior_profile") return html`<dl class="kv"><dt>Disputes, last 30 days</dt><dd>${d.dispute_count_30d}</dd><dt>Account age</dt><dd>${d.account_age_days} days</dd></dl>`;
  if (ev.kind === "route" || ev.kind === "gps_trace") return compact ? html`<p class="small muted">${ev.kind === "route" ? `${d.length_km.toFixed(2)} km` : `${d.length} GPS fixes`}. Open to see the map.</p>` : html`<${TripMap} caseId=${caseId} />`;
  return null;
}
function Cite({ caseId, refId, n }) {
  const ctx = useContext(EvidenceCtx);
  const [pos, setPos] = useState(null);
  const ref = useRef(null);
  const [label, icon] = refKind(refId);
  const show = () => {
    const r = ref.current.getBoundingClientRect();
    const left = Math.min(Math.max(12, r.left), window.innerWidth - 312);
    const top = r.bottom + 8 + 260 > window.innerHeight ? Math.max(12, r.top - 8 - 240) : r.bottom + 8;
    setPos({ left, top });
  };
  return html`<button ref=${ref} type="button" class=${n ? "fn" : `cite${refId.startsWith("POL-") ? " policy" : ""}`} onMouseEnter=${show} onMouseLeave=${() => setPos(null)} onFocus=${show} onBlur=${() => setPos(null)} onClick=${() => { setPos(null); ctx.open(caseId, refId); }} aria-label=${`${label} ${refId}, open evidence`}>
    ${n ? n : html`<${Icon} name=${icon} size=${12} />${refId}`}
    ${pos && html`<div class="popover" style=${pos} role="tooltip"><div class="popover-title"><span>${label}</span><span class="mono">${refId}</span></div><${Preview} caseId=${caseId} refId=${refId} compact=${true} /></div>`}
  </button>`;
}
function Drawer({ state, onClose }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  if (!state) return null;
  const { caseId, refId } = state;
  const [label] = refKind(refId);
  const ev = evOf(caseId)[refId];
  const isMap = ev && ["route", "gps_trace", "route_comparison", "pickup_proximity", "traffic_event"].includes(ev.kind);
  return html`<div>
    <div class="scrim" onClick=${onClose}></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label=${`${label} ${refId}`}>
      <div class="drawer-head">
        <div><p class="small muted">${label} · ${caseId}</p><h2 class="mono" style=${{ fontSize: 20 }}>${refId}</h2></div>
        <button class="close" onClick=${onClose} aria-label="Close"><${Icon} name="x" size=${16} /></button>
      </div>
      <div class="drawer-body">
        ${isMap && html`<div class="sheet" style=${{ border: "1px solid var(--hair)" }}><${TripMap} caseId=${caseId} /></div>`}
        ${refId.startsWith("POL-") ? html`<${PolicyView} refId=${refId} />` : ev && ev.kind === "chat_message" ? html`<${Chat} caseId=${caseId} highlight=${refId} />` : html`<${Preview} caseId=${caseId} refId=${refId} />`}
        <p class="tiny muted">${refId.startsWith("POL-") ? "From the policy the agents search. Figures marked “not Ryde-sourced” are this project's own rules." : "Exactly as it appears in the case file every agent worked from."}</p>
      </div>
    </aside>
  </div>`;
}
function Chat({ caseId, highlight }) {
  const msgs = Object.entries(evOf(caseId)).filter(([, e]) => e.kind === "chat_message").map(([k, e]) => ({ k, ...e.data })).sort((a, b) => a.timestamp.localeCompare(b.timestamp));
  if (!msgs.length) return html`<p class="small muted">No messages between rider and driver.</p>`;
  return html`<div class="bubbles">${msgs.map((m) => html`<div key=${m.k} class=${`bubble ${m.sender_role}${m.k === highlight ? " hl" : ""}`}><div class="who"><span>${m.sender_role === "rider" ? "Rider" : "Driver"} · ${clock(m.timestamp)}</span><span class="mono">${m.k}</span></div>${m.text}</div>`)}</div>`;
}
function Receipt({ data }) {
  return html`<dl class="kv"><dt>Base fare</dt><dd>${money(data.base_fare)}</dd><dt>Platform fee</dt><dd>${money(data.platform_fee)}</dd><dt>Taxes</dt><dd>${money(data.taxes)}</dd>
    ${(data.add_on_fees || []).map((f, i) => html`<${React.Fragment} key=${i}><dt>${f.type.replaceAll("_", " ").replace(/^./, (c) => c.toUpperCase())}</dt><dd>${money(f.amount)}</dd></${React.Fragment}>`)}
    <dt style=${{ color: "var(--ink)", fontWeight: 600 }}>Total charged</dt><dd style=${{ fontWeight: 600 }}>${money(data.total_fare)}</dd></dl>`;
}

/* ---------------- map: drawn from the case file's own coordinates ---------------- */
function TripMap({ caseId, height = 220, legend = true }) {
  const ev = evOf(caseId);
  const opt = ev["ROUTE-OPTIMAL"] ? ev["ROUTE-OPTIMAL"].data.geometry.coordinates : [];
  const act = ev["ROUTE-ACTUAL"] ? ev["ROUTE-ACTUAL"].data.geometry.coordinates : [];
  const gps = ev["GPS-TRACE"] ? ev["GPS-TRACE"].data : [];
  const prox = ev["PICKUP-PROXIMITY"] ? ev["PICKUP-PROXIMITY"].data : null;
  const traffic = Object.entries(ev).filter(([, e]) => e.kind === "traffic_event").map(([k, e]) => ({ k, lat: e.data.near_lat, lng: e.data.near_lng }));
  const noShow = prox && !prox.reached_pickup;
  const W = 420, H = Math.round(W * height / 420 * 0.62 + 120), pad = 28;
  const pts = [...opt, ...act, ...gps.map((p) => [p.lng, p.lat]), ...(prox ? [[prox.pickup.lng, prox.pickup.lat]] : []), ...traffic.map((t) => [t.lng, t.lat])];
  if (!pts.length) return html`<p class="small muted" style=${{ padding: 16 }}>No location data.</p>`;
  const lat0 = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  const kx = Math.cos(lat0 * Math.PI / 180);
  let xs = pts.map((p) => p[0] * kx), ys = pts.map((p) => p[1]);
  let [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const span = 0.006;
  if (x1 - x0 < span) { x0 -= span / 2; x1 += span / 2; }
  if (y1 - y0 < span) { y0 -= span / 2; y1 += span / 2; }
  const s = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (y1 - y0));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - (y1 - y0) * s) / 2;
  const px = (lng, lat) => [ox + (lng * kx - x0) * s, oy + (y1 - lat) * s];
  const path = (c) => c.map(([lng, lat], i) => `${i ? "L" : "M"}${px(lng, lat).map((n) => n.toFixed(1)).join(" ")}`).join(" ");
  const mPerPx = 111320 / s;
  const bar = [100, 200, 500, 1000, 2000, 5000].find((m) => m / mPerPx > 56) || 5000;
  const start = (act[0] || opt[0]), end = (act[act.length - 1] || opt[opt.length - 1]);
  const pickup = prox ? px(prox.pickup.lng, prox.pickup.lat) : null;
  const nearest = noShow && gps.length ? gps.reduce((b, p) => { const d = Math.hypot((p.lng - prox.pickup.lng) * kx, p.lat - prox.pickup.lat); return d < b.d ? { p, d } : b; }, { p: gps[0], d: Infinity }).p : null;
  return html`<div>
    <svg class="map" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Map of the trip drawn from the case file">
      <defs><pattern id=${`g${caseId}`} width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--map-grid)" stroke-width="1" /></pattern></defs>
      <rect width=${W} height=${H} fill=${`url(#g${caseId})`} />
      ${opt.length > 1 && !noShow && html`<path d=${path(opt)} fill="none" stroke="#9a9aa0" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round" />`}
      ${act.length > 1 && !noShow && html`<path d=${path(act)} fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />`}
      ${noShow && gps.map((p, i) => { const [x, y] = px(p.lng, p.lat); return html`<circle key=${i} cx=${x} cy=${y} r="2.6" fill="var(--driver)" opacity=".8" />`; })}
      ${pickup && noShow && html`<g>
        <circle cx=${pickup[0]} cy=${pickup[1]} r=${Math.max(prox.arrival_radius_m / mPerPx, 7)} fill="color-mix(in srgb, var(--good) 14%, transparent)" stroke="var(--good)" stroke-dasharray="3 3" />
        ${nearest && html`<line x1=${pickup[0]} y1=${pickup[1]} x2=${px(nearest.lng, nearest.lat)[0]} y2=${px(nearest.lng, nearest.lat)[1]} stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="4 4" />`}
        ${nearest && html`<text x=${(pickup[0] + px(nearest.lng, nearest.lat)[0]) / 2 + 8} y=${(pickup[1] + px(nearest.lng, nearest.lat)[1]) / 2} style=${{ fill: "var(--warn)", font: "600 12px var(--font)" }}>${(prox.closest_approach_m / 1000).toFixed(1)} km away</text>`}
      </g>`}
      ${traffic.map((t) => { const [x, y] = px(t.lng, t.lat); return html`<g key=${t.k}><path d=${`M${x} ${y - 9}L${x + 8} ${y + 6}L${x - 8} ${y + 6}Z`} fill="var(--warn)" stroke="#fff" stroke-width="1.5" /><text x=${x + 12} y=${y + 5} style=${{ fill: "var(--ink-2)", font: "500 11px var(--font)" }}>Roadworks</text></g>`; })}
      ${start && !noShow && html`<g><circle cx=${px(...start)[0]} cy=${px(...start)[1]} r="7" fill="#fff" stroke="var(--ink)" stroke-width="3" /></g>`}
      ${end && !noShow && html`<rect x=${px(...end)[0] - 6} y=${px(...end)[1] - 6} width="12" height="12" rx="3" fill="var(--ink)" />`}
      ${noShow && pickup && html`<g><circle cx=${pickup[0]} cy=${pickup[1]} r="6" fill="var(--rider)" stroke="#fff" stroke-width="2" /><text x=${pickup[0] + 10} y=${pickup[1] - 9} style=${{ fill: "var(--ink)", font: "600 12px var(--font)" }}>Pickup</text></g>`}
      <g transform=${`translate(${pad - 8}, ${H - 14})`}><line x1="0" x2=${bar / mPerPx} y1="0" y2="0" stroke="var(--ink-3)" stroke-width="2" /><text x="0" y="-6" style=${{ fill: "var(--ink-3)", font: "500 11px var(--font)" }}>${bar >= 1000 ? `${bar / 1000} km` : `${bar} m`}</text></g>
    </svg>
    ${legend && html`<div class="map-legend">
      ${!noShow && opt.length > 1 && html`<span><svg width="18" height="4"><line x1="1" x2="17" y1="2" y2="2" stroke="#9a9aa0" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round" /></svg>Fastest route</span>`}
      ${!noShow && act.length > 1 && html`<span><svg width="18" height="4"><line x1="1" x2="17" y1="2" y2="2" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" /></svg>Route driven</span>`}
      ${noShow && html`<span><svg width="10" height="10"><circle cx="5" cy="5" r="3" fill="var(--driver)" /></svg>Driver's GPS</span><span><svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="none" stroke="var(--good)" stroke-dasharray="2 2" /></svg>100 m arrival radius</span>`}
      ${traffic.length > 0 && html`<span><svg width="12" height="12"><path d="M6 1L11 10H1Z" fill="var(--warn)" /></svg>Recorded roadworks</span>`}
    </div>`}
  </div>`;
}

/* ---------------- policy: plain summary first, the cited clause formatted ---------------- */
const POLICY_INFO = {
  "POL-01": ["General principles", "Every decision rests on evidence, not on who argues harder. Both sides are held to the same standard, and whoever makes a claim has to support it."],
  "POL-02": ["Route deviation", "If a trip was much longer than the fastest route and nothing on record explains it, the fare for the extra distance is refunded: nothing under 10% longer, half between 10% and 25%, all of it above 25%. Roadworks or a closure near the route, or a detour the rider asked for, explain a detour."],
  "POL-03": ["No-show charge", "The $4.50 no-show fee stands only if the driver reached the pickup point (within 100 m), waited the grace period and tried to reach the rider. Otherwise it is waived."],
  "POL-04": ["Cleaning and damage fees", "A driver needs at least one photo. The fee follows what the photo shows: $40 for a spill or crumbs, $120 for mud, dirt or stains, $200 for vomit. Without a photo, the claim is declined and can be sent again."],
  "POL-05": ["Safety incidents", "Safety reports aren't decided under this policy. They go straight to a person."],
  "POL-06": ["Evidence standard", "When the evidence a claim needs is missing, the claim is declined, not denied, and can be refiled with that evidence."],
  "POL-07": ["Remedies and caps", "Refunds can't exceed the fare, cleaning fees can't exceed $200, and a waiver returns exactly the fee charged."],
  "POL-08": ["When a person decides", "A person decides when confidence is low, the fee is $120 or more, either party has filed three or more disputes in 30 days, or a rule check fails."],
};
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>").replace(/`(.+?)`/g, "<code>$1</code>");
function mdToHtml(src) {
  const blocks = src.trim().split(/\n\s*\n/);
  return blocks.map((b) => {
    const lines = b.split("\n").filter((l) => l.trim());
    if (lines.every((l) => l.trim().startsWith("|"))) {
      const rows = lines.filter((l) => !/^\|\s*-/.test(l.trim())).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      const [head, ...body] = rows;
      return `<div class="md-table"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    if (lines.every((l) => /^\s*[-*] /.test(l) || /^\s{2,}/.test(l))) {
      return `<ul>${lines.filter((l) => /^\s*[-*] /.test(l)).map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
    }
    return `<p>${inline(lines.join(" "))}</p>`;
  }).join("");
}
const clauseBody = (excerpt) => excerpt.replace(/^§\d+\.[^—]*—\s*/, "");
function sourceOf(text) {
  if (/not Ryde-sourced|our own/i.test(text)) return ["neutral", "Includes our own rules"];
  if (/real, sourced|help\.rydesharing|Terms of Use/i.test(text)) return ["good", "Ryde's published figures"];
  return null;
}
function PolicyView({ refId }) {
  const pid = refId.slice(0, 6);
  const clauses = D.policy[pid] || [];
  const cited = clauses.find((c) => c.chunk_id === refId);
  const [title, summary] = POLICY_INFO[pid] || [pid, ""];
  const others = clauses.filter((c) => c !== cited);
  return html`<div style=${{ display: "flex", flexDirection: "column", gap: 16 }}>
    <div><h3 style=${{ fontSize: 22, letterSpacing: "-0.02em" }}>${title}</h3><p style=${{ marginTop: 8, fontSize: 16, color: "var(--ink-2)" }}>${summary}</p></div>
    ${cited && html`<div class="clause cited"><div class="clause-head"><span class="mono">${cited.chunk_id}</span><span>The clause cited</span>${sourceOf(cited.excerpt) && html`<span class=${`pill ${sourceOf(cited.excerpt)[0]}`}>${sourceOf(cited.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(cited.excerpt)) }}></div></div>`}
    ${!cited && html`<div style=${{ display: "flex", flexDirection: "column", gap: 12 }}>${clauses.map((c) => html`<div key=${c.chunk_id} class="clause"><div class="clause-head"><span class="mono">${c.chunk_id}</span>${sourceOf(c.excerpt) && html`<span class=${`pill ${sourceOf(c.excerpt)[0]}`}>${sourceOf(c.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(c.excerpt)) }}></div></div>`)}</div>`}
    ${cited && others.length > 0 && html`<details class="more"><summary><${Icon} name="right" size=${14} />The rest of this section (${others.length} clause${others.length === 1 ? "" : "s"})</summary>
      <div style=${{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>${others.map((c) => html`<div key=${c.chunk_id} class="clause"><div class="clause-head"><span class="mono">${c.chunk_id}</span>${sourceOf(c.excerpt) && html`<span class=${`pill ${sourceOf(c.excerpt)[0]}`}>${sourceOf(c.excerpt)[1]}</span>`}</div><div class="md" dangerouslySetInnerHTML=${{ __html: mdToHtml(clauseBody(c.excerpt)) }}></div></div>`)}</div></details>`}
  </div>`;
}

/* ---------------- safety: case file prepared on request, no recommendation ---------------- */
function SafetyPrep({ id }) {
  const [stage, setStage] = useState("idle");
  const v = CASES[id].view;
  const ev = evOf(id);
  const trip = CASES[id].trip;
  useEffect(() => { if (stage !== "running") return; const t = setTimeout(() => setStage("done"), 1600); return () => clearTimeout(t); }, [stage]);

function classify(text) {
  const t = text.toLowerCase();
  if (/unsafe|threat|aggress|scared|danger|assault|harass|drunk|red light|reckless/.test(t)) return "safety";
  if (/vomit|spill|mess|dirt|mud|stain|clean|seat/.test(t)) return "damage";
  if (/no.?show|didn'?t show|never (came|showed)|cancel|waited|fee/.test(t)) return "noshow";
  if (/route|longer|detour|way round|long way|extra|distance|overcharg/.test(t)) return "route";
  return null;
}

const STAGES = {
  rider: (other) => [["Report received", ""], ["Checking eligibility", "Quick checks, no AI"], ["Gathering trip records", "GPS, route, fare, messages"], [`${first(other)} replies`, "They get to tell their side"], ["Hearing both sides", "An advocate argues for each of you"], ["Decision", ""]],

  driverFile: (other) => [["Report received", ""], ["Checking eligibility", "Quick checks, no AI"], ["Gathering trip records", "Trip, messages and your photo"], ["Photo check", "What the photo shows sets the fee tier"], [`${first(other)} replies`, "They get to tell their side"], ["Hearing both sides", "An advocate argues for each of you"], ["With a specialist", "Fees of $120 or more get a person's review"]],
};
function Tracking({ caseId, who, onDone, onProgress }) {
  const v = CASES[caseId].view;
  const safety = v.state === "safety_bypassed";
  const stages = safety ? [["Report received", ""], ["Sent to our safety team", "A person handles this"]] : STAGES[who](who === "driver" ? v.complainer_name : v.complainee_name);
  const [at, setAt] = useState(0);
  useEffect(() => {
    if (at >= stages.length) { const t = setTimeout(onDone, 700); return () => clearTimeout(t); }
    const t = setTimeout(() => setAt(at + 1), at === 0 ? 500 : 1100);
