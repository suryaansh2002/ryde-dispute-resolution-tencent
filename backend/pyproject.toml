[project]
name = "ryde-resolve-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.103",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "logfire>=5.1.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai-slim[anthropic,openrouter]>=2.51.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]

[tool.logfire]
ignore_no_config = true
