# Render Blueprint for the RydeResolve backend (system design §9).
# Dashboard -> New -> Blueprint -> pick this repo. Render prompts for every `sync: false`
# value on first create; paste them from the root .env WITHOUT the surrounding quotes.
services:
  - type: web
    name: ryde-resolve-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Same region as the Neon database (AWS us-east-2), so every DB query stays local.
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # DeepInfra runs the five agents and photo grading (AGENT_MODEL, VISION_MODEL).
      - key: DEEPINFRA_API_KEY
        sync: false
      # Gemini Flash, the photo-grading fallback (VISION_FALLBACK_MODELS).
      - key: GOOGLE_API_KEY
        sync: false
      # Model settings default in app/config.py; add AGENT_MODEL, AGENT_FALLBACK_MODELS,
      # VISION_MODEL, AGENT_OUTPUT_MODE etc. here to override without a code change.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
      # Only the Vercel frontend may call the API from a browser. Comma-separate to add
      # more origins (e.g. http://localhost:5173 to point a local frontend at Render).
      - key: CORS_ORIGINS
        value: https://ryde-dispute-resolution-tencent.vercel.app
